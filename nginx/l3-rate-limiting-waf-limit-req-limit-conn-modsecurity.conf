# nginx L3 — Rate Limiting + WAF: limit_req, limit_conn, ModSecurity integration
# Demonstrates: shared memory zones, burst queuing, connection limits,
#               user-agent blocking, IP allow-lists.
# Runs on stock nginx. The ModSecurity / OWASP CRS WAF is NOT in the stock image,
# so it lives in the optional level l3b (needs owasp/modsecurity-crs).
#
# Test syntax:
#   docker run --rm -v $PWD/l3-rate-limiting-waf-limit-req-limit-conn-modsecurity.conf:/etc/nginx/nginx.conf:ro nginx:1.31-alpine nginx -t

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid       /var/run/nginx.pid;

events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

http {
    include      /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format security_log
        '$remote_addr [$time_local] "$request" $status '
        '$body_bytes_sent "$http_referer" "$http_user_agent" '
        'limit_req_status=$limit_req_status';
    access_log /var/log/nginx/access.log security_log;

    sendfile   on;
    tcp_nopush on;
    keepalive_timeout 65;

    # ── Rate-limit shared memory zones ────────────────────────────────────────
    # Zone syntax: zone=<name>:<size>  — 1MB holds ~16,000 IP state entries
    #
    # Standard API rate limit: 10 req/s per IP
    limit_req_zone  $binary_remote_addr  zone=api_rate:10m  rate=10r/s;

    # Login endpoint: 5 req/min per IP (brute-force protection)
    limit_req_zone  $binary_remote_addr  zone=login_rate:10m  rate=5r/m;

    # Rate limiting per user needs a key the client cannot choose. Never key a
    # zone on a request header such as X-User-ID: change the header, dodge the
    # limit. Key on $binary_remote_addr, or on a claim you verified yourself
    # (see l-max). A single "global" zone keyed on $server_addr is also an
    # anti-pattern: one client can burn the quota of every other client.

    # ── Connection-limit zones ────────────────────────────────────────────────
    # Max simultaneous connections per IP
    limit_conn_zone $binary_remote_addr zone=conn_per_ip:10m;
    # Max simultaneous connections to a specific server
    limit_conn_zone $server_name        zone=conn_per_server:10m;

    # Return 429 (Too Many Requests) instead of default 503
    limit_req_status  429;
    limit_conn_status 429;

    # ModSecurity / OWASP CRS: see l3b-modsecurity-owasp-crs-waf-optional.conf

    # ── Geo-blocking (requires ngx_http_geoip2_module) ────────────────────────
    # geoip2 /usr/share/GeoIP/GeoLite2-Country.mmdb {
    #     $geoip2_country_code country iso_code;
    # }
    # map $geoip2_country_code $blocked_country {
    #     default  0;
    #     CN       1;
    #     RU       1;
    # }

    # ── Bot / bad UA blocking ─────────────────────────────────────────────────
    map $http_user_agent $blocked_agent {
        default          0;
        ~*masscan        1;
        ~*zgrab          1;
        ~*nikto          1;
        ~*sqlmap         1;
        ~*python-requests 0;   # allow legitimate API clients
    }

    server {
        listen 80;
        server_name api.example.com;

        # Block bad agents before any processing
        if ($blocked_agent) {
            return 403;
        }

        # ── Connection limits ─────────────────────────────────────────────────
        limit_conn conn_per_ip     20;    # max 20 concurrent connections per IP
        limit_conn conn_per_server 1000;  # max 1000 total to this vhost

        # ── Public API endpoints ──────────────────────────────────────────────
        location /api/ {
            # burst=20: allow 20 req queued before rejecting; nodelay: serve burst immediately
            limit_req zone=api_rate burst=20 nodelay;

            proxy_pass         http://127.0.0.1:3000;
            proxy_http_version 1.1;
            proxy_set_header   Host            $host;
            proxy_set_header   X-Real-IP       $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # ── Login endpoint: strict rate limit, no burst queue ────────────────
        location /api/auth/login {
            limit_req zone=login_rate;        # no burst — every excess req rejected immediately
            limit_req_log_level warn;

            proxy_pass         http://127.0.0.1:3000;
            proxy_http_version 1.1;
            proxy_set_header   Host            $host;
            proxy_set_header   X-Real-IP       $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;

            # Extra: reject oversized login bodies (prevent credential stuffing payloads)
            client_max_body_size 4k;
        }

        # ── Admin area: rate limit + IP whitelist ────────────────────────────
        location /admin/ {
            # Allow only internal networks
            allow 10.0.0.0/8;
            allow 172.16.0.0/12;
            allow 192.168.0.0/16;
            deny  all;

            limit_req zone=api_rate burst=5;

            proxy_pass         http://127.0.0.1:4000;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
        }

        # ── Upload endpoint: limit body size + connection rate ────────────────
        location /api/upload {
            client_max_body_size   50m;
            client_body_timeout    60s;
            limit_req              zone=api_rate burst=5 nodelay;
            limit_conn             conn_per_ip 3;  # override: max 3 upload conns per IP

            proxy_pass             http://127.0.0.1:3000;
            proxy_request_buffering off;           # stream body directly to upstream
        }

        # Custom error pages
        error_page 429 /429.html;
        error_page 403 /403.html;
        location = /429.html { root /usr/share/nginx/html; internal; }
        location = /403.html { root /usr/share/nginx/html; internal; }
    }
}
