# nginx L4 — SSL/TLS Hardening: TLS 1.2/1.3 only, strong ciphers, HSTS, mTLS
# Demonstrates: ssl_protocols, ssl_ciphers, HSTS, session settings, security
#               headers, client-certificate (mTLS) vhost, and when OCSP stapling
#               does and does not apply.
#
# Prerequisites:
#   - Valid certificate + chain in fullchain.pem (cert + intermediates)
#   - Private key in privkey.pem
#   - No DH params file: the cipher list below is ECDHE-only, so DHE (and
#     ssl_dhparam) is never used. A 4096-bit dhparam would be wasted work.
#
# Test: ./check.sh creates throw-away certs and mounts them at the paths used
# below, then runs `nginx -t` on this file mounted as /etc/nginx/nginx.conf.

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid       /var/run/nginx.pid;

events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

http {
    include      /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile   on;
    tcp_nopush on;
    keepalive_timeout 65;

    # ── TLS global settings ───────────────────────────────────────────────────
    # Allow only TLS 1.2 and 1.3 — drops SSLv3, TLS 1.0, TLS 1.1
    ssl_protocols TLSv1.2 TLSv1.3;

    # TLS 1.2 cipher suite (TLS 1.3 ciphers are not configurable in nginx)
    # ECDHE for forward secrecy, GCM for AEAD, no RC4/3DES/MD5
    ssl_ciphers 'ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256';

    # Let the client pick among the strong suites above (Mozilla "intermediate"
    # recommends off now that every listed suite is AEAD + forward secret).
    ssl_prefer_server_ciphers off;

    # ── Session resumption ────────────────────────────────────────────────────
    # Session cache: shared across workers, 10MB ≈ 40,000 sessions
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # Disable session tickets to prevent ticket-key rotation issues
    # (forward secrecy risk if ticket key is compromised)
    ssl_session_tickets off;

    # ── OCSP Stapling (OFF here on purpose) ──────────────────────────────────
    # Let's Encrypt shut its OCSP responders down on 2025-08-06 and no longer puts
    # an OCSP URL in its certificates, so `ssl_stapling on` only logs
    # "no OCSP responder URL". Enable it only for a CA that still runs OCSP:
    #   ssl_stapling            on;
    #   ssl_stapling_verify     on;
    #   ssl_trusted_certificate /etc/nginx/ca-chain.pem;   # CA chain to verify the reply
    #   resolver                10.0.0.2 valid=300s;       # your internal DNS
    #   resolver_timeout        5s;

    # ── HSTS (per server) ──────────────────────────────────────────
    # Included in add_header per server block for control; see below.
    # Do NOT set globally here if any vhost still serves HTTP.

    # ── HTTP → HTTPS redirect vhost ───────────────────────────────────────────
    server {
        listen 80;
        listen [::]:80;
        server_name example.com www.example.com;

        # Redirect all HTTP to HTTPS (301 permanent)
        return 301 https://$host$request_uri;
    }

    # ── Primary HTTPS vhost ───────────────────────────────────────────────────
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;                          # HTTP/2 (nginx 1.25.1+ syntax)
        server_name example.com www.example.com;

        # Certificate files (Let's Encrypt or commercial CA)
        ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;

        # ── HSTS ──────────────────────────────────────────────────────────────
        # max-age=63072000 = 2 years (required for preload list submission)
        # includeSubDomains: enforce HTTPS on all subdomains
        # Add `; preload` only after reading hstspreload.org: removal takes months.
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

        # ── Security headers ──────────────────────────────────────────────────
        add_header X-Frame-Options           "DENY"                              always;
        add_header X-Content-Type-Options    "nosniff"                           always;
        # X-XSS-Protection is obsolete and can introduce XSS in old browsers: send 0 or omit.
        add_header X-XSS-Protection          "0"                                 always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin"   always;
        add_header Permissions-Policy        "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy   "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'" always;

        # Certificate Transparency (Expect-CT deprecated in 2023, kept for reference)
        # add_header Expect-CT "max-age=86400, enforce" always;

        # ── Hide server info ──────────────────────────────────────────────────
        server_tokens off;

        # ── Proxy to app backend ──────────────────────────────────────────────
        location / {
            proxy_pass         http://127.0.0.1:3000;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Connection        "";
        }

        # Let's Encrypt ACME challenge (needed if using certbot webroot mode)
        location ^~ /.well-known/acme-challenge/ {
            root /var/www/certbot;
            allow all;
        }
    }

    # ── mTLS vhost: client certificate required ───────────────────────────────
    # Use case: internal service-to-service, admin API, B2B partners
    server {
        listen 8443 ssl;
        http2 on;
        server_name internal-api.example.com;

        ssl_certificate     /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;

        # Require and verify client certificate signed by our internal CA
        ssl_client_certificate /etc/nginx/certs/internal-ca.crt;
        ssl_verify_client      on;
        ssl_verify_depth       2;

        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

        location / {
            # Forward verified client cert DN to backend
            proxy_set_header X-Client-Cert-DN   $ssl_client_s_dn;
            proxy_set_header X-Client-Cert-Valid $ssl_client_verify;
            proxy_pass http://127.0.0.1:5000;
        }
    }
}
