# nginx L2 — Load Balancing with upstream, least_conn, and active health checks
# Demonstrates: upstream groups, balancing algorithms, weights, health checks,
#               backup servers, keepalive pool to upstream, slow_start (nginx plus)
# Note: active health_check directive requires nginx Plus; OSS uses passive only.
#       For OSS active health checks use nginx-upstream-check-module or Traefik.
# Test: docker run --rm -v $PWD/l2-load-balancing-upstream-least-conn-health-check.conf:/etc/nginx/nginx.conf:ro nginx:1.31-alpine nginx -t

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid       /var/run/nginx.pid;

events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

http {
    include      /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format upstream_log
        '$remote_addr [$time_local] "$request" $status '
        'upstream=$upstream_addr rt=$request_time '
        'uct=$upstream_connect_time urt=$upstream_response_time';
    access_log /var/log/nginx/access.log upstream_log;

    sendfile    on;
    tcp_nopush  on;
    keepalive_timeout 65;

    # ── Upstream: HTTP API — least_conn algorithm ────────────────────────────
    # least_conn: routes to backend with fewest active connections (good for
    # long-lived or variable-duration requests).
    upstream api_backends {
        least_conn;

        # weight: higher weight = more requests directed to that node
        server 10.0.1.10:8080 weight=3;
        server 10.0.1.11:8080 weight=2;
        server 10.0.1.12:8080 weight=1;

        # Passive health check: mark down after 3 failures in 30s window
        # server will be re-probed after fail_timeout expires
        server 10.0.1.13:8080 max_fails=3 fail_timeout=30s;

        # Backup: only used when all primaries are down
        server 10.0.1.99:8080 backup;

        # Upstream keepalive pool: reuse connections to backends
        # Reduces TCP handshake overhead for high-throughput APIs
        keepalive 32;          # max idle keepalive connections per worker
        keepalive_requests 100;
        keepalive_timeout  60s;
    }

    # ── Upstream: static assets — round-robin (default) ─────────────────────
    upstream static_backends {
        # Default algorithm: round-robin (no directive needed)
        server 10.0.2.10:80;
        server 10.0.2.11:80;
        server 10.0.2.12:80 down;   # manually disabled (maintenance)

        keepalive 16;
    }

    # ── Upstream: gRPC service — least_conn ──────────────────────────────────
    upstream grpc_backends {
        least_conn;
        server 10.0.3.10:9090;
        server 10.0.3.11:9090;
        keepalive 8;
    }

    # ── Upstream: WebSocket chat — ip_hash (session affinity) ────────────────
    # ip_hash: same client IP always routed to same backend
    # Use when backend is stateful and no shared session store exists
    upstream websocket_backends {
        ip_hash;
        server 10.0.4.10:3000;
        server 10.0.4.11:3000;
    }

    # ── Virtual host ─────────────────────────────────────────────────────────
    server {
        listen 80;
        server_name lb.example.com;

        # Proxy defaults
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";   # required for keepalive
        proxy_connect_timeout 5s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;

        # ── nginx OSS passive health: return 502 if all backends fail ─────────
        proxy_next_upstream error timeout invalid_header http_500 http_502 http_503;
        proxy_next_upstream_tries    3;
        proxy_next_upstream_timeout  10s;

        # API traffic
        location /api/ {
            proxy_pass http://api_backends;

            # nginx Plus active health check (comment out for OSS):
            # health_check interval=5s fails=2 passes=3 uri=/health;
        }

        # Static assets
        location /static/ {
            proxy_pass         http://static_backends;
            # (No proxy_cache is configured here, so there is no cache status to
            # report. Add proxy_cache_path + proxy_cache to teach caching.)
        }

        # gRPC proxy
        location /grpc/ {
            grpc_pass          grpc://grpc_backends;
            grpc_set_header    Host $host;
            error_page 502     = /grpc_error;
        }

        # gRPC clients need a gRPC-shaped error, not an HTML 502.
        location = /grpc_error {
            internal;
            default_type application/grpc;
            add_header grpc-status 14 always;          # UNAVAILABLE
            add_header grpc-message "upstream unavailable" always;
            return 204;
        }

        # WebSocket
        location /ws/ {
            proxy_pass         http://websocket_backends;
            proxy_http_version 1.1;
            # Repeat the inherited headers: setting any proxy_set_header here
            # discards the ones from the server level above.
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        "upgrade";
            proxy_read_timeout 3600s;
        }

        # nginx OSS active-ish health endpoint (manual probe script calls this)
        location /nginx-health {
            access_log off;
            default_type text/plain;
            return 200 "healthy\n";
        }
    }
}
