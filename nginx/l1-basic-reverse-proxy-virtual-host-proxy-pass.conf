# nginx L1 — Basic Reverse Proxy with Virtual Hosts and proxy_pass
# Demonstrates: server blocks, proxy_pass, proxy headers, location blocks
# Test syntax: nginx -t -c /path/to/this/file (requires nginx installed)
#
# Install & test locally:
#   docker run --rm -v $(pwd):/etc/nginx/conf.d:ro nginx:alpine nginx -t

# ── Global / events (required when used as standalone nginx.conf) ─────────────
# If including into an existing nginx.conf, remove this block and the http{} wrapper.
worker_processes  auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;                     # Linux optimal I/O event model
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ── Logging ───────────────────────────────────────────────────────────────
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;

    # ── Performance ───────────────────────────────────────────────────────────
    sendfile           on;
    tcp_nopush         on;
    tcp_nodelay        on;
    keepalive_timeout  65;
    gzip               on;
    gzip_types         text/plain text/css application/json application/javascript text/xml;

    # ── Proxy defaults (shared across all upstreams) ─────────────────────────
    proxy_http_version      1.1;
    proxy_set_header        Host              $host;
    proxy_set_header        X-Real-IP         $remote_addr;
    proxy_set_header        X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header        X-Forwarded-Proto $scheme;
    proxy_set_header        Connection        "";     # enable keepalive to upstream
    proxy_connect_timeout   10s;
    proxy_send_timeout      30s;
    proxy_read_timeout      30s;
    proxy_buffering         on;
    proxy_buffer_size       8k;
    proxy_buffers           8 32k;

    # ── Virtual Host 1: app.example.com → backend on port 3000 ──────────────
    server {
        listen 80;
        server_name app.example.com;

        # Health-check endpoint served by nginx itself
        location /health {
            access_log off;
            return 200 "ok\n";
            add_header Content-Type text/plain;
        }

        # Main app proxy
        location / {
            proxy_pass http://127.0.0.1:3000;
        }

        # Static assets served directly (bypass app server)
        location /static/ {
            root /var/www/app;
            expires 30d;
            add_header Cache-Control "public, immutable";
        }
    }

    # ── Virtual Host 2: api.example.com → backend on port 4000, path rewrite ─
    server {
        listen 80;
        server_name api.example.com;

        # Strip /v1 prefix before forwarding
        location /v1/ {
            rewrite ^/v1/(.*)$ /$1 break;
            proxy_pass http://127.0.0.1:4000;
        }

        # Websocket upgrade support
        location /ws/ {
            proxy_pass          http://127.0.0.1:4000;
            proxy_http_version  1.1;
            proxy_set_header    Upgrade    $http_upgrade;
            proxy_set_header    Connection "upgrade";
            proxy_read_timeout  3600s;   # long-lived WS connection
        }
    }

    # ── Catch-all: return 444 for unknown Host headers ────────────────────────
    server {
        listen 80 default_server;
        server_name _;
        return 444;   # close connection immediately, no response
    }
}
