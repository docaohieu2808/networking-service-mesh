# nginx L3b (OPTIONAL) - ModSecurity v3 + OWASP Core Rule Set WAF
# Needs the ModSecurity-nginx dynamic module, which the stock nginx image does
# NOT ship (that is why `modsecurity on;` fails there with "unknown directive").
# Use the OWASP image that bundles nginx + module + CRS:
#   owasp/modsecurity-crs:nginx-alpine
# Its entrypoint renders /etc/modsecurity.d/setup.conf from templates first, so
# run the check through the entrypoint (./check.sh and CI do exactly this):
#   docker run --rm -v $PWD/l3b-modsecurity-owasp-crs-waf-optional.conf:/tmp/nginx.conf:ro \
#     owasp/modsecurity-crs:nginx-alpine nginx -t -c /tmp/nginx.conf
#
# Roll-out advice: start with SecRuleEngine DetectionOnly (env MODSEC_RULE_ENGINE),
# read the audit log, tune false positives, then switch to On.

load_module modules/ngx_http_modsecurity_module.so;

worker_processes auto;
error_log /var/log/nginx/error.log notice;
pid       /tmp/nginx.pid;      # the image runs as the unprivileged nginx user

events {
    worker_connections 1024;
}

http {
    include      /etc/nginx/mime.types;
    default_type application/octet-stream;

    # The image runs non-root: keep every temp path somewhere writable.
    proxy_temp_path       /tmp/proxy_temp;
    client_body_temp_path /tmp/client_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    # WAF on for every server below. setup.conf (rendered by the entrypoint)
    # pulls in modsecurity.conf, crs-setup.conf and the CRS rules.
    modsecurity on;
    modsecurity_rules_file /etc/modsecurity.d/setup.conf;

    server {
        listen 8080;
        server_name api.example.com;

        location / {
            proxy_pass         http://127.0.0.1:3000;
            proxy_http_version 1.1;
            proxy_set_header   Host            $host;
            proxy_set_header   X-Real-IP       $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Per-location opt-out, e.g. a webhook receiver that sends odd payloads.
        location /webhooks/ {
            modsecurity off;
            proxy_pass http://127.0.0.1:3000;
        }
    }
}
