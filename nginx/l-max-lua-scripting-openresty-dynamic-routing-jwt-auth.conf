# nginx L-MAX - OpenResty Lua scripting: dynamic routing, JWT auth, response rewriting
# Demonstrates: access_by_lua_block calling a shared Lua module, lua-resty-jwt,
#               lua-resty-redis in a timer, ngx.shared dicts, header/body filters.
#
# OpenResty only (stock nginx has no Lua). Build and check:
#   docker build -t nginx-lab-openresty -f openresty.Dockerfile .
#   docker run --rm -e JWT_SECRET=$(openssl rand -hex 32) \
#     -v $PWD/<this file>:/usr/local/openresty/nginx/conf/nginx.conf:ro \
#     nginx-lab-openresty openresty -t
# The image installs lua-resty-jwt with `opm get cdbattags/lua-resty-jwt`
# (the maintained fork; SkyLothar's is abandoned) and ships ./lua/auth.lua.
#
# SECURITY NOTES (each one was a real bug in an earlier version of this file):
#  1. `env JWT_SECRET;` below is REQUIRED. Without it nginx clears the worker
#     environment, os.getenv() returns nil and any hard-coded fallback becomes
#     the real secret. This lab has no fallback and fails closed (HTTP 500).
#  2. access_by_lua_block in a location replaces the server-level one, so the
#     auth check is a function (lua/auth.lua) called from EVERY protected
#     location instead of one block at server level.
#  3. Rate limiting keys on the verified JWT subject, never on a request header
#     the client controls.

env JWT_SECRET;

worker_processes auto;
error_log /dev/stderr warn;
pid       /tmp/nginx.pid;

events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

http {
    include      mime.types;          # relative to the conf dir (OpenResty has no /etc/nginx/mime.types)
    default_type application/octet-stream;
    access_log   /dev/stdout;
    sendfile on;
    keepalive_timeout 65;

    # ── Lua package path ──────────────────────────────────────────────────────
    lua_package_path "/etc/nginx/lua/?.lua;/usr/local/openresty/lualib/?.lua;;";

    # ── Shared dictionaries (in-process memory, shared across workers) ────────
    lua_shared_dict  jwt_cache      10m;   # verified JWT claims, keyed by token
    lua_shared_dict  rate_limit     10m;   # per-user request counters
    lua_shared_dict  route_config   1m;    # dynamic routing table

    # ── Init worker: load the routing table from Redis ────────────────────────
    # Cosockets (and so Redis) are disabled inside init_worker_by_lua itself, so
    # the first load runs from a zero-delay timer. Worker 0 does the work; the
    # result lands in a shared dict that every worker reads.
    init_worker_by_lua_block {
        if ngx.worker.id() ~= 0 then return end
        local redis = require "resty.redis"
        local cjson = require "cjson.safe"
        local dict  = ngx.shared.route_config

        local function load_routes(premature)
            if premature then return end
            local r = redis:new()
            r:set_timeout(1000)
            local ok, err = r:connect("127.0.0.1", 6379)
            if not ok then
                ngx.log(ngx.WARN, "redis connect failed: ", err)
                return
            end
            local routes = r:get("nginx:routes")
            if routes and routes ~= ngx.null then
                -- Expected shape: {"version:v2": "service_b", ...}
                local t = cjson.decode(routes)
                if type(t) == "table" then
                    local n = 0
                    for k, v in pairs(t) do
                        dict:set(k, v)
                        n = n + 1
                    end
                    ngx.log(ngx.INFO, "loaded ", n, " routes from Redis")
                end
            end
            r:set_keepalive(10000, 10)   -- return the socket to the pool
        end

        assert(ngx.timer.at(0, load_routes))
        assert(ngx.timer.every(30, load_routes))
    }

    # ── Upstream backends ─────────────────────────────────────────────────────
    upstream service_a { server 127.0.0.1:3001; keepalive 16; }
    upstream service_b { server 127.0.0.1:3002; keepalive 16; }
    upstream service_c { server 127.0.0.1:3003; keepalive 16; }

    server {
        listen 80;
        server_name api.example.com;

        proxy_http_version 1.1;
        proxy_set_header   Connection "";
        proxy_set_header   Host $host;

        # Anything not listed below is a 404: protected paths are opt-in below,
        # nothing is reachable by default without going through require_jwt().
        location / {
            return 404;
        }

        # ── Dynamic routing by X-API-Version, JWT required ────────────────────
        location /api/ {
            access_by_lua_block { require("auth").require_jwt() }

            set $proxy_upstream "service_a";
            rewrite_by_lua_block {
                local dict    = ngx.shared.route_config
                local version = ngx.req.get_headers()["X-API-Version"]
                if type(version) ~= "string" then version = "v1" end

                local upstream_map = { v1 = "service_a", v2 = "service_b", v3 = "service_c" }
                -- Whitelist: a Redis value (or the client header) can only ever
                -- select one of the upstream groups defined in this file.
                local allowed = { service_a = true, service_b = true, service_c = true }

                local target = dict:get("version:" .. version) or upstream_map[version]
                if not allowed[target] then target = "service_a" end
                ngx.var.proxy_upstream = target
            }
            proxy_pass http://$proxy_upstream;
        }

        # ── Per-user rate limit (a more specific prefix wins over /api/) ──────
        # Auth is repeated here on purpose: this location does not inherit the
        # access phase from /api/.
        location /api/expensive {
            access_by_lua_block {
                local auth = require("auth")
                auth.require_jwt()
                auth.rate_limit(10, 60)      -- 10 requests per 60 s per verified user
            }
            proxy_pass http://service_a;
        }

        # ── Response transformation in Lua ────────────────────────────────────
        location /api/transform {
            access_by_lua_block { require("auth").require_jwt() }

            proxy_set_header Accept-Encoding "";      # body must not be gzip to be rewritten
            proxy_pass       http://service_b;

            # The body length changes, so the upstream Content-Length is wrong.
            header_filter_by_lua_block {
                ngx.header.content_length = nil
                ngx.ctx.buffer = {}
            }

            # The body arrives in chunks: collect them and rewrite at EOF.
            body_filter_by_lua_block {
                local chunk, eof = ngx.arg[1], ngx.arg[2]
                local buf = ngx.ctx.buffer
                if chunk and chunk ~= "" then
                    buf[#buf + 1] = chunk
                end
                if not eof then
                    ngx.arg[1] = nil          -- swallow until the last chunk
                    return
                end
                local body = table.concat(buf)
                local cjson = require "cjson.safe"
                local data = cjson.decode(body)
                if type(data) == "table" then
                    data._request_id = ngx.var.request_id
                    body = cjson.encode(data)
                end
                ngx.arg[1] = body
            }
        }

        # ── Public: no auth, no Lua overhead ──────────────────────────────────
        location /health {
            access_log off;
            default_type application/json;
            content_by_lua_block {
                ngx.say('{"status":"ok","worker":' .. ngx.worker.id() .. '}')
            }
        }
        location /public/ {
            proxy_pass http://service_a;
        }
    }
}
