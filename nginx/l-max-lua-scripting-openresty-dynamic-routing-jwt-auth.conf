# nginx L-MAX — OpenResty Lua scripting: dynamic routing, JWT validation, custom logic
# Demonstrates: content_by_lua_block, access_by_lua_block, lua-resty-jwt,
#               lua-resty-redis, ngx.var, ngx.req, cosocket-based upstream calls
#
# Requirements: OpenResty (https://openresty.org) — nginx + LuaJIT bundled
#   Docker: docker run --rm openresty/openresty:alpine openresty -t
#   Luarocks packages: lua-resty-jwt, lua-resty-redis, lua-resty-http
#   Install: opm get SkyLothar/lua-resty-jwt jkeys089/lua-resty-redis
#
# This config is NOT compatible with stock nginx — OpenResty only.

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid       /var/run/nginx.pid;

events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

http {
    include      /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;

    # ── Lua package path ──────────────────────────────────────────────────────
    lua_package_path  "/usr/local/openresty/lualib/?.lua;/etc/nginx/lua/?.lua;;";
    lua_package_cpath "/usr/local/openresty/lualib/?.so;;";

    # ── Shared dictionaries (in-process memory, shared across workers) ────────
    lua_shared_dict  jwt_cache      10m;   # cache validated JWT claims
    lua_shared_dict  rate_limit     10m;   # token bucket counters
    lua_shared_dict  route_config   1m;    # dynamic routing table

    # ── Init worker: preload routing table from Redis ─────────────────────────
    init_worker_by_lua_block {
        local redis = require "resty.redis"
        local cjson = require "cjson.safe"
        local dict  = ngx.shared.route_config

        local function load_routes()
            local r = redis:new()
            r:set_timeout(1000)
            local ok, err = r:connect("127.0.0.1", 6379)
            if not ok then
                ngx.log(ngx.WARN, "redis connect failed: ", err)
                return
            end
            local routes, err = r:get("nginx:routes")
            if routes and routes ~= ngx.null then
                local t = cjson.decode(routes)
                if t then
                    for k, v in pairs(t) do
                        dict:set(k, v)
                    end
                    ngx.log(ngx.INFO, "loaded ", #t, " routes from Redis")
                end
            end
            r:close()
        end

        -- Reload routes every 30 seconds
        local ok, err = ngx.timer.every(30, load_routes)
        if not ok then
            ngx.log(ngx.ERR, "timer.every failed: ", err)
        end
        load_routes()
    }

    # ── Upstream backends ─────────────────────────────────────────────────────
    upstream service_a { server 127.0.0.1:3001; keepalive 16; }
    upstream service_b { server 127.0.0.1:3002; keepalive 16; }
    upstream service_c { server 127.0.0.1:3003; keepalive 16; }

    server {
        listen 80;
        server_name api.example.com;

        # ── JWT validation: runs before every proxied request ─────────────────
        access_by_lua_block {
            -- Skip auth for public endpoints
            local uri = ngx.var.uri
            if uri == "/health" or uri:match("^/public/") then
                return
            end

            local jwt    = require "resty.jwt"
            local cjson  = require "cjson.safe"
            local dict   = ngx.shared.jwt_cache
            local secret = os.getenv("JWT_SECRET") or "changeme"

            -- Extract Bearer token
            local auth_header = ngx.req.get_headers()["Authorization"] or ""
            local token = auth_header:match("^Bearer (.+)$")
            if not token then
                ngx.status = 401
                ngx.header["Content-Type"] = "application/json"
                ngx.say(cjson.encode({ error = "missing token" }))
                return ngx.exit(401)
            end

            -- Check cache first (avoid re-validating every request)
            local cached = dict:get(token)
            if cached then
                local claims = cjson.decode(cached)
                -- Inject user context into upstream headers
                ngx.req.set_header("X-User-ID",    claims.sub)
                ngx.req.set_header("X-User-Role",  claims.role or "user")
                return
            end

            -- Validate JWT signature + expiry
            local verified = jwt:verify(secret, token)
            if not verified.verified then
                ngx.status = 401
                ngx.header["Content-Type"] = "application/json"
                ngx.say(cjson.encode({ error = verified.reason }))
                return ngx.exit(401)
            end

            local claims = verified.payload
            -- Cache for remaining TTL (exp - now), max 5 min
            local ttl = math.max(0, math.min((claims.exp or 0) - ngx.time(), 300))
            if ttl > 0 then
                dict:set(token, cjson.encode(claims), ttl)
            end

            ngx.req.set_header("X-User-ID",    claims.sub)
            ngx.req.set_header("X-User-Role",  claims.role or "user")
        }

        # ── Dynamic routing: route by header or path ──────────────────────────
        location /api/ {
            proxy_http_version 1.1;
            proxy_set_header   Connection "";
            proxy_set_header   Host $host;

            rewrite_by_lua_block {
                local dict    = ngx.shared.route_config
                local version = ngx.req.get_headers()["X-API-Version"] or "v1"

                -- Dynamic upstream selection based on API version header
                local upstream_map = {
                    v1 = "service_a",
                    v2 = "service_b",
                    v3 = "service_c",
                }

                -- Check runtime override from Redis-loaded route table
                local override = dict:get("version:" .. version)
                local target   = override or upstream_map[version] or "service_a"

                ngx.var.proxy_upstream = target
            }

            # Use variable upstream (set in rewrite_by_lua_block)
            set $proxy_upstream "service_a";
            proxy_pass http://$proxy_upstream;
        }

        # ── Rate limiting in Lua: token bucket per user ───────────────────────
        location /api/expensive {
            access_by_lua_block {
                local dict    = ngx.shared.rate_limit
                local user_id = ngx.req.get_headers()["X-User-ID"] or ngx.var.remote_addr
                local key     = "rl:" .. user_id
                local limit   = 10    -- max requests per window
                local window  = 60    -- seconds

                local count, err = dict:incr(key, 1, 0, window)
                if not count then
                    -- Key expired and was recreated, count is 1
                    count = 1
                end

                if count > limit then
                    ngx.status = 429
                    ngx.header["Retry-After"] = window
                    ngx.header["Content-Type"] = "application/json"
                    ngx.say('{"error":"rate limit exceeded"}')
                    return ngx.exit(429)
                end

                ngx.header["X-RateLimit-Limit"]     = limit
                ngx.header["X-RateLimit-Remaining"] = math.max(0, limit - count)
            }

            proxy_pass         http://service_a;
            proxy_http_version 1.1;
            proxy_set_header   Connection "";
        }

        # ── Response transformation in Lua ────────────────────────────────────
        location /api/transform {
            proxy_pass         http://service_b;
            proxy_http_version 1.1;
            proxy_set_header   Connection "";

            # Modify response body: inject request-id into JSON response
            body_filter_by_lua_block {
                local chunk = ngx.arg[1]
                local eof   = ngx.arg[2]

                if eof and chunk and #chunk > 0 then
                    local cjson = require "cjson.safe"
                    local data  = cjson.decode(chunk)
                    if data then
                        data._request_id = ngx.var.request_id
                        data._served_by  = ngx.var.hostname
                        ngx.arg[1] = cjson.encode(data)
                    end
                end
            }
        }

        # ── Health check (no auth, no Lua overhead) ───────────────────────────
        location /health {
            access_log off;
            content_by_lua_block {
                ngx.header["Content-Type"] = "application/json"
                ngx.say('{"status":"ok","worker":' .. ngx.worker.id() .. '}')
            }
        }
    }
}
