# Lab fixtures for the l2 policy checks (used by CI, runnable by hand).
# api-service is the policy target; frontend is the one client the policy allows;
# intruder is in the SAME namespace but not allowed. The extra egress policy
# below exists only because l2's default-deny also blocks the clients' own egress.
apiVersion: v1
kind: Namespace
metadata:
  name: production
---
apiVersion: v1
kind: Service
metadata:
  name: api-service
  namespace: production
spec:
  selector:
    app: api-service
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-service
  namespace: production
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-service
  template:
    metadata:
      labels:
        app: api-service
    spec:
      containers:
        - name: app
          image: traefik/whoami:v1.12.0
          args: ["--port", "8080"]
          ports:
            - containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 10001
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: production
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: curl
          image: curlimages/curl:8.23.0
          command: ["sleep", "3600"]
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 10001
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: intruder
  namespace: production
spec:
  replicas: 1
  selector:
    matchLabels:
      app: intruder
  template:
    metadata:
      labels:
        app: intruder
    spec:
      containers:
        - name: curl
          image: curlimages/curl:8.23.0
          command: ["sleep", "3600"]
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 10001
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
---
# Egress: both clients may try to reach api-service (the destination side decides).
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: lab-clients-egress-to-api-service
  namespace: production
spec:
  endpointSelector:
    matchExpressions:
      - key: app
        operator: In
        values: [frontend, intruder]
  egress:
    - toEndpoints:
        - matchLabels:
            app: api-service
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
