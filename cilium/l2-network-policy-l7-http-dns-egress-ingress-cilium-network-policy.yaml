# Cilium L2 — CiliumNetworkPolicy: L7 HTTP rules, DNS egress, ingress/egress RBAC
# Demonstrates: L3/L4/L7 policies, DNS-based egress, entity selectors,
#               HTTP method/path rules, toFQDNs, namespace selectors
#
# Apply: kubectl apply -f l2-network-policy-l7-http-dns-egress-ingress-cilium-network-policy.yaml
# Prereq: Cilium installed with the L7 proxy enabled (default); namespace production exists.
# Order: apply the default-deny policy first, then the allow policies on top.
# The node-level firewall that used to live in this file is now l3 (it needs
# hostFirewall.enabled=true, which l1 keeps off).

---
# ── CiliumNetworkPolicy: api-service — full L3/L4/L7 policy ──────────────────
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: api-service-network-policy
  namespace: production
spec:
  # Select workload this policy applies to
  endpointSelector:
    matchLabels:
      app: api-service

  # ── INGRESS rules ─────────────────────────────────────────────────────────
  ingress:
    # Allow HTTP from frontend pods in same namespace
    - fromEndpoints:
        - matchLabels:
            app: frontend
            io.kubernetes.pod.namespace: production
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
          rules:
            http:
              # L7 HTTP rules: restrict methods and paths
              - method: GET
                path: /api/users(/.*)?
              - method: POST
                path: /api/users
              - method: PUT
                path: /api/users/[^/]+
              - method: DELETE
                path: /api/users/[^/]+
                # Require a header for DELETE (extra safety). Header rules are
                # STRINGS in "Name: value" form, not a map.
                headers:
                  - "X-Confirm-Delete: true"

    # No rule is needed for kubelet probes: Cilium always allows traffic from the
    # local node (entity `host`) to its pods, and L7 rules cannot be applied to
    # the host entity anyway.

    # Allow Prometheus scraping from monitoring namespace
    - fromEndpoints:
        - matchLabels:
            app: prometheus
            io.kubernetes.pod.namespace: monitoring
      toPorts:
        - ports:
            - port: "9090"
              protocol: TCP

    # (An earlier version ended with `fromEntities: cluster` "for Hubble relay".
    #  That admits every pod in the cluster and cancels the L7 allow-list above.
    #  Hubble relay talks to the Cilium agents, not to your pods, so it needs no rule.)

  # ── EGRESS rules ──────────────────────────────────────────────────────────
  egress:
    # Allow DNS resolution (required for service discovery)
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
          rules:
            dns:
              # Allow DNS queries for internal cluster services
              - matchPattern: "*.cluster.local"
              - matchPattern: "*.production.svc.cluster.local"
              # Allow specific external domains (allowlist)
              - matchName: "api.stripe.com"
              - matchName: "api.sendgrid.com"
              - matchPattern: "*.amazonaws.com"

    # Allow calls to reviews-service (L7 HTTP restricted)
    - toEndpoints:
        - matchLabels:
            app: reviews-service
            io.kubernetes.pod.namespace: production
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
          rules:
            http:
              - method: GET
                path: /reviews(/.*)?

    # Allow calls to external payment API via FQDN
    - toFQDNs:
        - matchName: "api.stripe.com"
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP

    # Allow calls to S3 (wildcard FQDN)
    - toFQDNs:
        - matchPattern: "*.s3.amazonaws.com"
        - matchPattern: "s3.*.amazonaws.com"
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP

    # Allow Kubernetes API server access (for service account token validation)
    - toEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
            - port: "6443"
              protocol: TCP

---
# ── CiliumNetworkPolicy: default deny all in namespace (zero-trust baseline) ──
# Apply this FIRST, then layer allow policies on top.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: default-deny-all
  namespace: production
spec:
  # Empty endpointSelector = applies to ALL pods in namespace
  endpointSelector: {}
  ingress:
    - {}    # deny all ingress (empty rule = no match = deny)
  egress:
    # Always allow DNS (otherwise nothing works)
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
