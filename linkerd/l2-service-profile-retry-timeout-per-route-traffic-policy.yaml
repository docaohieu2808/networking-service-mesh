# Linkerd L2 - Per-route retries and timeouts, traffic split, and mTLS-based policy
# Demonstrates: ServiceProfile (the classic way), Gateway API HTTPRoute with
#               retry/timeout annotations (the current way), Server +
#               AuthorizationPolicy + MeshTLSAuthentication (policy.linkerd.io).
#
# Prereqs: l1 installed (CRD chart with installGatewayAPI=true, or Gateway API CRDs
#          already on the cluster), namespace production from l1b.
# Apply:   kubectl apply -f l2-service-profile-retry-timeout-per-route-traffic-policy.yaml
#
# Two different services are used on purpose. When an HTTPRoute exists for a
# Service, Linkerd uses it and ignores that Service's ServiceProfile, so mixing the
# two on the same Service just hides one of them:
#   reviews-service -> ServiceProfile (legacy; still supported, gives per-route metrics)
#   api-service     -> HTTPRoute + annotations (recommended for new work)
# TrafficSplit (SMI) is gone: SMI support was removed from Linkerd, use HTTPRoute weights.

---
# ── ServiceProfile: per-route metrics, timeouts and retries for reviews-service ─
# Lives in the CLIENT namespace (the caller's side) and is named after the
# service FQDN. Routes classify requests so linkerd-viz shows golden metrics per route.
apiVersion: linkerd.io/v1alpha2
kind: ServiceProfile
metadata:
  name: reviews-service.production.svc.cluster.local
  namespace: production
spec:
  routes:
    - name: GET /reviews
      condition:
        method: GET
        pathRegex: /reviews(/.*)?
      timeout: 3s
      isRetryable: true          # idempotent read: safe to retry

    - name: POST /reviews
      condition:
        method: POST
        pathRegex: /reviews
      timeout: 8s
      isRetryable: false         # never retry a write: duplicate reviews

  # Caps retry load across all retryable routes to prevent retry storms
  retryBudget:
    retryRatio: 0.2              # retries may add up to 20% extra requests
    minRetriesPerSecond: 10      # always allow some retries on low traffic
    ttl: 10s

---
# ── Server: which pods/port the inbound policy applies to ────────────────────
# Once a Server selects a port, ONLY traffic matched by an AuthorizationPolicy is
# allowed (the Helm default policy no longer applies to it). Kubelet probes to the
# paths in the pod's probes are authorized automatically by the policy controller.
apiVersion: policy.linkerd.io/v1beta3
kind: Server
metadata:
  name: api-service-http
  namespace: production
spec:
  podSelector:
    matchLabels:
      app: api-service
  port: 8080
  proxyProtocol: HTTP/1        # must match what the app speaks: HTTP/1 | HTTP/2 | gRPC | opaque | TLS

---
# ── MeshTLSAuthentication: "this exact ServiceAccount identity" ───────────────
# Use identityRefs OR identities, not both (the schema accepts exactly one).
# A wildcard identity such as "*.production.serviceaccount.identity.linkerd..."
# would admit EVERY service account in the namespace, not just the frontend.
apiVersion: policy.linkerd.io/v1alpha1
kind: MeshTLSAuthentication
metadata:
  name: frontend-sa-authn
  namespace: production
spec:
  identityRefs:
    - kind: ServiceAccount
      name: frontend-service

---
# ── AuthorizationPolicy: only the frontend may call api-service ──────────────
apiVersion: policy.linkerd.io/v1alpha1
kind: AuthorizationPolicy
metadata:
  name: api-service-allow-frontend
  namespace: production
spec:
  targetRef:
    group: policy.linkerd.io
    kind: Server
    name: api-service-http
  requiredAuthenticationRefs:
    - name: frontend-sa-authn
      kind: MeshTLSAuthentication
      group: policy.linkerd.io

---
# ── HTTPRoute (Gateway API v1): canary split plus retries/timeouts ───────────
# Retries and timeouts are annotations on the route (or on the Service):
#   retry.linkerd.io/http   - which status classes to retry (5xx, gateway-error, ...)
#   retry.linkerd.io/limit  - max retries per request
#   timeout.linkerd.io/request - total request timeout
# Linkerd's Gateway API CRDs are bundle v1.1.1, which serves HTTPRoute v1.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: api-service-routes
  namespace: production
  annotations:
    retry.linkerd.io/http: "5xx"
    retry.linkerd.io/limit: "2"
    retry.linkerd.io/timeout: "2s"
    timeout.linkerd.io/request: "10s"
spec:
  parentRefs:
    - name: api-service
      kind: Service
      group: ""                 # core API group
      port: 8080
  rules:
    # /api/v2/* always goes to the new version
    - matches:
        - path:
            type: PathPrefix
            value: /api/v2
      backendRefs:
        - name: api-service-v2
          port: 8080
    # /api/v1/* always goes to the stable version
    - matches:
        - path:
            type: PathPrefix
            value: /api/v1
      backendRefs:
        - name: api-service-v1
          port: 8080
    # Everything else: 90/10 canary
    - backendRefs:
        - name: api-service-v1
          port: 8080
          weight: 90
        - name: api-service-v2
          port: 8080
          weight: 10

---
# ── Lab backends so the objects above point at something real ────────────────
apiVersion: v1
kind: ServiceAccount
metadata:
  name: frontend-service
  namespace: production
---
apiVersion: v1
kind: Service
metadata:
  name: api-service-v1
  namespace: production
spec:
  selector: {app: api-service-lab, version: v1}
  ports: [{name: http, port: 8080, targetPort: 8080}]
---
apiVersion: v1
kind: Service
metadata:
  name: api-service-v2
  namespace: production
spec:
  selector: {app: api-service-lab, version: v2}
  ports: [{name: http, port: 8080, targetPort: 8080}]
---
apiVersion: v1
kind: Service
metadata:
  name: reviews-service
  namespace: production
spec:
  selector: {app: api-service-lab, version: v1}
  ports: [{name: http, port: 8080, targetPort: 8080}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-service-v1
  namespace: production
spec:
  replicas: 1
  selector:
    matchLabels: {app: api-service-lab, version: v1}
  template:
    metadata:
      labels: {app: api-service-lab, version: v1}
    spec:
      containers:
        - name: app
          image: traefik/whoami:v1.12.0
          args: ["--port", "8080", "--name", "v1"]
          ports: [{containerPort: 8080}]
          securityContext: {allowPrivilegeEscalation: false, runAsNonRoot: true, runAsUser: 10001, capabilities: {drop: [ALL]}}
          resources: {requests: {cpu: 10m, memory: 16Mi}, limits: {memory: 64Mi}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-service-v2
  namespace: production
spec:
  replicas: 1
  selector:
    matchLabels: {app: api-service-lab, version: v2}
  template:
    metadata:
      labels: {app: api-service-lab, version: v2}
    spec:
      containers:
        - name: app
          image: traefik/whoami:v1.12.0
          args: ["--port", "8080", "--name", "v2"]
          ports: [{containerPort: 8080}]
          securityContext: {allowPrivilegeEscalation: false, runAsNonRoot: true, runAsUser: 10001, capabilities: {drop: [ALL]}}
          resources: {requests: {cpu: 10m, memory: 16Mi}, limits: {memory: 64Mi}}
