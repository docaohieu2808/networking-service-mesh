# Linkerd L1 - Install the control plane with Helm (values file)
# Demonstrates: CRD chart + control-plane chart, mTLS trust anchor and issuer
#               certificates, proxy defaults, a hardened default inbound policy.
#
# WHICH LINKERD? Since Feb 2024 the Linkerd project publishes only EDGE releases
# as open source (edge-26.10.1 / chart 2026.10.1 as of 2026-10-26). The "stable"
# 2.x line (2.15 ... 2.20) is released only as Buoyant Enterprise for Linkerd
# (BEL). The old repo https://helm.linkerd.io/stable is frozen at chart 1.16.11
# (Linkerd ~2.14) and must not be used. This lab uses the OSS edge charts.
# Edge is a rolling release: pin the chart version and read the release notes.
#
# This file is a plain values file. The Namespace and Deployment manifests are in
# l1b-namespace-and-workload-manifests.yaml (Helm only reads the first YAML
# document of a -f file, so they must not share a file).
#
# The control plane needs a trust anchor and an issuer certificate. Helm does
# NOT generate them. Create throw-away ones with ./gen-certs.sh (production:
# cert-manager + an offline root, or your own PKI), then:
#
#   helm repo add linkerd-edge https://helm.linkerd.io/edge && helm repo update
#   helm install linkerd-crds linkerd-edge/linkerd-crds -n linkerd --create-namespace \
#     --version 2026.10.1 --set installGatewayAPI=true
#   helm install linkerd-control-plane linkerd-edge/linkerd-control-plane -n linkerd \
#     --version 2026.10.1 -f l1-install-inject-control-plane-namespace-annotation.yaml \
#     --set-file identityTrustAnchorsPEM=certs/ca.crt \
#     --set-file identity.issuer.tls.crtPEM=certs/issuer.crt \
#     --set-file identity.issuer.tls.keyPEM=certs/issuer.key
#   kubectl -n linkerd rollout status deploy --timeout=180s
#
# installGatewayAPI=true makes the CRD chart ship the Gateway API HTTPRoute CRDs
# Linkerd was tested with (v1.1.1). If your cluster already has Gateway API CRDs
# (for example Istio's), leave it false.
# Small cluster (kind): add --set controllerReplicas=1 --set enablePodAntiAffinity=false

controllerReplicas: 3            # HA control plane
enablePodAntiAffinity: true      # spread replicas across nodes

# Secure by default: with the stock "all-unauthenticated" any pod can talk to any
# meshed pod. "cluster-authenticated" accepts only mTLS clients from this cluster;
# everything else needs a Server + AuthorizationPolicy (see l2).
# (Use "audit" first to see what a stricter policy would block.)
proxy:
  defaultInboundPolicy: cluster-authenticated
  resources:
    cpu:
      request: 10m
      limit: 1000m
    memory:
      request: 20Mi
      limit: 250Mi
  logLevel: warn,linkerd=info
  logFormat: json                # json | plain
  nativeSidecar: true            # boolean: sidecar as a native init container (Kubernetes 1.29+, GA in 1.33)

# Ports the init container leaves alone. This lives under proxyInit, not proxy.
proxyInit:
  ignoreInboundPorts: "4567,4568"
  ignoreOutboundPorts: "4567,4568"

# Identity (mTLS certificate management)
identity:
  issuer:
    scheme: linkerd.io/tls
    clockSkewAllowance: 20s
    issuanceLifetime: 24h0m0s
    # tls.crtPEM / tls.keyPEM are passed with --set-file (see above), never committed.

# CNI plugin: avoids granting NET_ADMIN to the proxy-init container.
# Install it separately: helm install linkerd-cni linkerd-edge/linkerd-cni -n linkerd-cni --create-namespace
cniEnabled: false
