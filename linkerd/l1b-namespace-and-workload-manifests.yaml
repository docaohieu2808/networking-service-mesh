# Linkerd L1b - Namespace injection and a meshed workload
# Demonstrates: namespace-level injection, opting a namespace out, per-pod proxy
#               tuning annotations, a Deployment that follows pod-security basics.
# Apply: kubectl apply -f l1b-namespace-and-workload-manifests.yaml
# Check: linkerd check --proxy -n production

---
# Opt in: every pod created in this namespace gets the proxy
apiVersion: v1
kind: Namespace
metadata:
  name: production
  annotations:
    linkerd.io/inject: enabled
---
# Explicitly off (batch jobs, legacy)
apiVersion: v1
kind: Namespace
metadata:
  name: batch-jobs
  annotations:
    linkerd.io/inject: disabled
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-service
  namespace: production
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-service
  template:
    metadata:
      labels:
        app: api-service
      annotations:
        # Per-pod proxy resource overrides
        config.linkerd.io/proxy-cpu-request: "20m"
        config.linkerd.io/proxy-memory-request: "32Mi"
        config.linkerd.io/proxy-cpu-limit: "500m"
        config.linkerd.io/proxy-memory-limit: "128Mi"
        # Bypass the proxy for these destination ports (e.g. Kafka, Redis)
        config.linkerd.io/skip-outbound-ports: "6379,9092"
        # Per-pod proxy log level
        config.linkerd.io/proxy-log-level: "linkerd=info,warn"
    spec:
      containers:
        - name: api-service
          image: traefik/whoami:v1.12.0     # pinned; stands in for your application image
          args: ["--port", "8080"]
          ports:
            - containerPort: 8080
              name: http
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 10001
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: api-service
  namespace: production
spec:
  selector:
    app: api-service
  ports:
    - name: http
      port: 8080
      targetPort: 8080

# The viz extension (dashboard, Prometheus) is a separate chart:
#   helm install linkerd-viz linkerd-edge/linkerd-viz -n linkerd-viz --create-namespace --version 2026.10.1
# Tap live traffic:   linkerd viz tap deploy/api-service -n production
# Golden metrics:     linkerd viz stat deploy -n production
