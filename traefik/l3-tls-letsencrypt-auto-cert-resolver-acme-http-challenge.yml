# Traefik L3 — Automatic TLS with Let's Encrypt (ACME HTTP-01 challenge)
# Demonstrates: certificatesResolvers, ACME http-challenge, cert storage, TLS options
# Requirements:
#   - Public DNS pointing to this host
#   - Port 80 reachable from internet for HTTP-01 challenge
#   - Replace all example.com / admin@example.com values
# Usage: docker compose -f l3-tls-letsencrypt-auto-cert-resolver-acme-http-challenge.yml up -d

version: "3.9"

services:
  traefik:
    image: traefik:v3.0
    container_name: traefik-l3
    restart: unless-stopped
    command:
      - "--log.level=INFO"
      - "--accesslog=true"
      - "--api.dashboard=true"

      # --- EntryPoints ---
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"

      # Global HTTP→HTTPS redirect
      - "--entrypoints.web.http.redirections.entryPoint.to=websecure"
      - "--entrypoints.web.http.redirections.entryPoint.scheme=https"
      - "--entrypoints.web.http.redirections.entryPoint.permanent=true"

      # --- Certificate Resolver: Let's Encrypt (HTTP-01) ---
      - "--certificatesresolvers.letsencrypt.acme.email=admin@example.com"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web"

      # Use staging CA during testing to avoid rate limits; remove for production:
      # - "--certificatesresolvers.letsencrypt.acme.caserver=https://acme-staging-v02.api.letsencrypt.org/directory"

      # --- Certificate Resolver: Let's Encrypt (DNS-01 via env vars) ---
      # Uncomment and set provider env vars for wildcard certs:
      # - "--certificatesresolvers.letsencrypt-dns.acme.email=admin@example.com"
      # - "--certificatesresolvers.letsencrypt-dns.acme.storage=/letsencrypt/acme-dns.json"
      # - "--certificatesresolvers.letsencrypt-dns.acme.dnschallenge.provider=cloudflare"
      # - "--certificatesresolvers.letsencrypt-dns.acme.dnschallenge.resolvers=1.1.1.1:53,8.8.8.8:53"

      # --- TLS Options: enforce minimum TLS 1.2, strong ciphers ---
      - "--providers.docker=true"
      - "--providers.docker.exposedByDefault=false"
      - "--providers.docker.network=traefik_net"

      # File provider for static TLS options (see below via volume)
      - "--providers.file.filename=/config/tls-options.yml"
      - "--providers.file.watch=true"
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
      - "letsencrypt_data:/letsencrypt"
      - "./tls-options-static-config.yml:/config/tls-options.yml:ro"
    environment:
      # Required for DNS-01 Cloudflare (only needed if using DNS challenge):
      # CF_DNS_API_TOKEN: "${CF_DNS_API_TOKEN}"
      DUMMY: "placeholder"
    networks:
      - traefik_net

  # Backend service with automatic TLS
  webapp:
    image: traefik/whoami
    container_name: webapp-l3
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      # HTTPS router with auto-cert
      - "traefik.http.routers.webapp.entrypoints=websecure"
      - "traefik.http.routers.webapp.rule=Host(`app.example.com`)"
      - "traefik.http.routers.webapp.tls=true"
      - "traefik.http.routers.webapp.tls.certresolver=letsencrypt"
      # Enforce hardened TLS options defined in file provider
      - "traefik.http.routers.webapp.tls.options=hardened@file"
      - "traefik.http.services.webapp.loadbalancer.server.port=80"
    networks:
      - traefik_net

  # Wildcard cert example (requires DNS-01 resolver)
  api:
    image: traefik/whoami
    container_name: api-l3
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api.entrypoints=websecure"
      - "traefik.http.routers.api.rule=Host(`api.example.com`)"
      - "traefik.http.routers.api.tls=true"
      # For wildcard: switch to letsencrypt-dns resolver
      - "traefik.http.routers.api.tls.certresolver=letsencrypt"
      - "traefik.http.routers.api.tls.domains[0].main=example.com"
      - "traefik.http.routers.api.tls.domains[0].sans=*.example.com"
      - "traefik.http.services.api.loadbalancer.server.port=80"
    networks:
      - traefik_net

volumes:
  letsencrypt_data:
    driver: local

networks:
  traefik_net:
    name: traefik_net
    driver: bridge
