# Traefik L2 - Middlewares: rate limiting, basic auth, HTTPS redirect
# Demonstrates: middleware chaining, rateLimit, basicAuth, redirectScheme, stripPrefix
# Usage:
#   export BASIC_AUTH_USERS="$(htpasswd -nbB admin 'choose-a-password')"   # bcrypt; or: admin:$(openssl passwd -apr1 'pw')
#   docker compose -f l2-middleware-rate-limit-basic-auth-https-redirect.yml up -d --wait
# The users string is substituted by Compose from your shell, so its `$` signs do
# NOT need doubling (they would only if you pasted the hash literally into a label).
# There is no committed hash: a hash in git is a password in git.

services:
  traefik:
    image: traefik:v3.7.16
    container_name: traefik-l2
    restart: unless-stopped
    command:
      - "--log.level=INFO"
      - "--accesslog=true"
      - "--global.checkNewVersion=false"
      - "--ping=true"

      # EntryPoints. The dashboard is off in this level (no api.insecure), so
      # nothing publishes 8080.
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      # --- Entry point hardening (Traefik 3.7 warns when these are unset) ---
      - "--entrypoints.web.http.aliasHeadersStrategy=delete"            # drop X_Auth_User style aliases of managed headers
      - "--entrypoints.web.http.encodedCharacters.allowEncodedSlash=false"
      - "--entrypoints.web.http.encodedCharacters.allowEncodedBackSlash=false"
      - "--entrypoints.web.http.encodedCharacters.allowEncodedNullCharacter=false"
      # --- Entry point hardening (Traefik 3.7 warns when these are unset) ---
      - "--entrypoints.websecure.http.aliasHeadersStrategy=delete"            # drop X_Auth_User style aliases of managed headers
      - "--entrypoints.websecure.http.encodedCharacters.allowEncodedSlash=false"
      - "--entrypoints.websecure.http.encodedCharacters.allowEncodedBackSlash=false"
      - "--entrypoints.websecure.http.encodedCharacters.allowEncodedNullCharacter=false"

      # Redirect all HTTP -> HTTPS at entrypoint level is the alternative to the
      # per-router redirect middleware used below:
      # - "--entrypoints.web.http.redirections.entryPoint.to=websecure"
      # - "--entrypoints.web.http.redirections.entryPoint.scheme=https"

      - "--providers.docker=true"
      - "--providers.docker.endpoint=tcp://docker-socket-proxy:2375"
      - "--providers.docker.exposedByDefault=false"
      - "--providers.docker.network=traefik_net"
    ports:
      - "80:80"
      - "443:443"
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    depends_on:
      - docker-socket-proxy
    networks:
      - traefik_net
      - socket_net

  # The Docker socket is root-equivalent even when mounted :ro (the API still
  # accepts writes). Traefik talks to a filtering proxy that only allows the
  # read endpoints its Docker provider needs, on a network nothing else joins.
  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:v0.5.0
    restart: unless-stopped
    environment:
      CONTAINERS: "1"     # list/inspect containers (labels)
      NETWORKS: "1"       # resolve container IPs per network
      EVENTS: "1"         # watch start/stop
      POST: "0"           # no write calls at all
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
    networks:
      - socket_net

  app:
    image: traefik/whoami:v1.12.0
    container_name: app-l2
    restart: unless-stopped
    labels:
      - "traefik.enable=true"

      # -- Middleware: HTTPS redirect --
      - "traefik.http.middlewares.redirect-to-https.redirectscheme.scheme=https"
      - "traefik.http.middlewares.redirect-to-https.redirectscheme.permanent=true"

      # -- Middleware: rate limiting --
      # average requests per period, burst = extra headroom, period = window
      - "traefik.http.middlewares.rate-limit-standard.ratelimit.average=100"
      - "traefik.http.middlewares.rate-limit-standard.ratelimit.burst=50"
      - "traefik.http.middlewares.rate-limit-standard.ratelimit.period=1m"

      # -- Middleware: basic auth (htpasswd format: bcrypt, or apr1/sha1) --
      - "traefik.http.middlewares.basic-auth-admin.basicauth.users=${BASIC_AUTH_USERS:?export BASIC_AUTH_USERS, see the header}"
      - "traefik.http.middlewares.basic-auth-admin.basicauth.realm=Admin Area"
      - "traefik.http.middlewares.basic-auth-admin.basicauth.removeheader=true"

      # -- Middleware: strip path prefix (declared for the lab, chain it where needed) --
      - "traefik.http.middlewares.strip-api-prefix.stripprefix.prefixes=/api"

      # -- HTTP router (redirect only) --
      - "traefik.http.routers.app-http.entrypoints=web"
      - "traefik.http.routers.app-http.rule=Host(`app.example.com`)"
      - "traefik.http.routers.app-http.middlewares=redirect-to-https"

      # -- HTTPS router with rate limit + auth --
      - "traefik.http.routers.app-https.entrypoints=websecure"
      - "traefik.http.routers.app-https.rule=Host(`app.example.com`)"
      # Middleware order matters: rate-limit first, then auth
      - "traefik.http.routers.app-https.middlewares=rate-limit-standard,basic-auth-admin"
      - "traefik.http.routers.app-https.tls=true"      # no certresolver -> Traefik's built-in self-signed cert

      - "traefik.http.services.app.loadbalancer.server.port=80"
    networks:
      - traefik_net

networks:
  traefik_net:
    name: traefik_net
    driver: bridge
  socket_net:
    internal: true      # only traefik and the socket proxy are attached
