# Traefik L4 — Dynamic File Provider: Routers, Services, Middlewares via static files
# Demonstrates: file provider, dynamic config hot-reload, TCP/UDP routing, custom headers
# Usage: docker compose -f l4-dynamic-file-provider-routers-services-middlewares-static-config.yml up -d
#
# Traefik watches /config/dynamic/ for *.yml changes and hot-reloads without restart.
# Mount this directory with your dynamic config files (see inline examples below).

version: "3.9"

services:
  traefik:
    image: traefik:v3.0
    container_name: traefik-l4
    restart: unless-stopped
    command:
      - "--log.level=INFO"
      - "--accesslog=true"
      - "--api.dashboard=true"
      - "--api.insecure=true"

      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--entrypoints.tcp-custom.address=:9000/tcp"

      # Docker provider for container auto-discovery
      - "--providers.docker=true"
      - "--providers.docker.exposedByDefault=false"
      - "--providers.docker.network=traefik_net"

      # File provider — watch entire directory for dynamic configs
      - "--providers.file.directory=/config/dynamic"
      - "--providers.file.watch=true"
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"
      - "9000:9000"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
      - "./dynamic:/config/dynamic:ro"   # mount your dynamic config directory
    networks:
      - traefik_net

  backend-a:
    image: traefik/whoami
    container_name: backend-a
    restart: unless-stopped
    networks:
      - traefik_net

  backend-b:
    image: traefik/whoami
    container_name: backend-b
    restart: unless-stopped
    networks:
      - traefik_net

networks:
  traefik_net:
    name: traefik_net
    driver: bridge

# ──────────────────────────────────────────────────────────────────────────────
