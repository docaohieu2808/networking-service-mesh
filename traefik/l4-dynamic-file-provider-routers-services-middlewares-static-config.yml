# Traefik L4 - Dynamic file provider: routers, services, middlewares, TCP, TLS options
# Demonstrates: file provider on a directory (hot reload, no restart), HTTP
#               load balancing with health checks and sticky cookies, a TCP
#               router, reusable middlewares, TLS options.
# The dynamic files live in ./dynamic/ (http-routers-services.yml, tcp-router.yml,
# tls-options.yml): edit one while the stack runs and Traefik reloads it.
# Usage: docker compose -f l4-dynamic-file-provider-routers-services-middlewares-static-config.yml up -d --wait
#   curl -H 'Host: a.localhost' http://127.0.0.1/      # load balanced over backend-a, backend-a2
#   curl -H 'Host: b.localhost' http://127.0.0.1/api   # backend-b
#   curl http://127.0.0.1:9000/                         # raw TCP proxy to backend-b

services:
  traefik:
    image: traefik:v3.7.16
    container_name: traefik-l4
    restart: unless-stopped
    command:
      - "--log.level=INFO"
      - "--accesslog=true"
      - "--global.checkNewVersion=false"
      - "--ping=true"
      - "--api.dashboard=true"
      - "--api.insecure=true"          # lab only; loopback-only port below

      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--entrypoints.tcp-custom.address=:9000/tcp"
      # --- Entry point hardening (Traefik 3.7 warns when these are unset) ---
      - "--entrypoints.web.http.aliasHeadersStrategy=delete"
      - "--entrypoints.web.http.encodedCharacters.allowEncodedSlash=false"
      - "--entrypoints.web.http.encodedCharacters.allowEncodedBackSlash=false"
      - "--entrypoints.web.http.encodedCharacters.allowEncodedNullCharacter=false"
      # --- Same hardening on the TLS entry point ---
      - "--entrypoints.websecure.http.aliasHeadersStrategy=delete"
      - "--entrypoints.websecure.http.encodedCharacters.allowEncodedSlash=false"
      - "--entrypoints.websecure.http.encodedCharacters.allowEncodedBackSlash=false"
      - "--entrypoints.websecure.http.encodedCharacters.allowEncodedNullCharacter=false"

      # Docker provider for container auto-discovery
      - "--providers.docker=true"
      - "--providers.docker.endpoint=tcp://docker-socket-proxy:2375"
      - "--providers.docker.exposedByDefault=false"
      - "--providers.docker.network=traefik_net"

      # File provider: watch the whole directory for dynamic configs
      - "--providers.file.directory=/config/dynamic"
      - "--providers.file.watch=true"
    ports:
      - "80:80"
      - "443:443"
      - "127.0.0.1:8080:8080"
      - "9000:9000"
    volumes:
      - "./dynamic:/config/dynamic:ro"
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    depends_on:
      - docker-socket-proxy
    networks:
      - traefik_net
      - socket_net

  # The Docker socket is root-equivalent even when mounted :ro (the API still
  # accepts writes). Traefik talks to a filtering proxy that only allows the
  # read endpoints its Docker provider needs, on a network nothing else joins.
  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:v0.5.0
    restart: unless-stopped
    environment:
      CONTAINERS: "1"     # list/inspect containers (labels)
      NETWORKS: "1"       # resolve container IPs per network
      EVENTS: "1"         # watch start/stop
      POST: "0"           # no write calls at all
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
    networks:
      - socket_net


  backend-a:
    image: traefik/whoami:v1.12.0
    container_name: backend-a
    restart: unless-stopped
    networks:
      - traefik_net

  backend-a2:
    image: traefik/whoami:v1.12.0
    container_name: backend-a2
    restart: unless-stopped
    networks:
      - traefik_net

  backend-b:
    image: traefik/whoami:v1.12.0
    container_name: backend-b
    restart: unless-stopped
    networks:
      - traefik_net

networks:
  traefik_net:
    name: traefik_net
    driver: bridge
  socket_net:
    internal: true      # only traefik and the socket proxy are attached
