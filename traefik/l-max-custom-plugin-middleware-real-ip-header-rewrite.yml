# Traefik L-MAX - Middleware plugins from the Traefik Plugin Catalog
# Demonstrates: experimental.plugins (downloaded at startup), plugin config via
#               labels, a real-IP plugin guarded by a secret CDN header, a
#               header-transformation plugin, and the built-in headers middleware.
#
# Plugins (both verified live in https://plugins.traefik.io, 2026-10):
#   - github.com/Paxxs/traefik-get-real-ip   v1.0.4  real client IP behind CDNs
#   - github.com/tomMoulard/htransformation  v0.3.3  set/delete/rename headers
# The earlier plugins in this file (soulbalz/traefik-real-ip, maksimkurb/
# traefik-bot-blocker, traefik/plugin-rewriteheaders) no longer exist on GitHub,
# so Traefik could not start. Plugins are fetched from the catalog at startup:
# the host needs outbound HTTPS to plugins.traefik.io and proxy.golang.org.
# Pin a version for every plugin, and re-check the catalog before you reuse one:
# plugins run inside the proxy with no sandbox beyond Yaegi's interpreter.
#
# Usage: docker compose -f l-max-custom-plugin-middleware-real-ip-header-rewrite.yml up -d --wait
#   curl -H 'Host: app.localhost' -H 'X-From-Cdn: lab-secret-rotate-me' \
#        -H 'Cf-Connecting-Ip: 198.51.100.7' -H 'X-User-ID: root' http://127.0.0.1/
#   -> whoami shows X-Real-Ip: 198.51.100.7 and no X-User-ID

services:
  traefik:
    image: traefik:v3.7.16
    container_name: traefik-lmax
    restart: unless-stopped
    command:
      - "--log.level=INFO"
      - "--accesslog=true"
      - "--global.checkNewVersion=false"
      - "--ping=true"

      - "--api.dashboard=true"
      - "--api.insecure=true"          # lab only; loopback-only port below

      - "--entrypoints.web.address=:80"
      - "--entrypoints.web.http.aliasHeadersStrategy=delete"
      - "--entrypoints.web.http.encodedCharacters.allowEncodedSlash=false"
      - "--entrypoints.web.http.encodedCharacters.allowEncodedBackSlash=false"
      - "--entrypoints.web.http.encodedCharacters.allowEncodedNullCharacter=false"

      - "--providers.docker=true"
      - "--providers.docker.endpoint=tcp://docker-socket-proxy:2375"
      - "--providers.docker.exposedByDefault=false"
      - "--providers.docker.network=traefik_net"

      # -- Plugin: real client IP (trusts a CDN's IP header only when the secret header matches) --
      - "--experimental.plugins.real-ip.moduleName=github.com/Paxxs/traefik-get-real-ip"
      - "--experimental.plugins.real-ip.version=v1.0.4"

      # -- Plugin: header transformation --
      - "--experimental.plugins.htransformation.moduleName=github.com/tomMoulard/htransformation"
      - "--experimental.plugins.htransformation.version=v0.3.3"
    ports:
      - "80:80"
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s                # plugin download happens before the entry points open
    depends_on:
      - docker-socket-proxy
    networks:
      - traefik_net
      - socket_net

  # The Docker socket is root-equivalent even when mounted :ro (the API still
  # accepts writes). Traefik talks to a filtering proxy that only allows the
  # read endpoints its Docker provider needs, on a network nothing else joins.
  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:v0.5.0
    restart: unless-stopped
    environment:
      CONTAINERS: "1"     # list/inspect containers (labels)
      NETWORKS: "1"       # resolve container IPs per network
      EVENTS: "1"         # watch start/stop
      POST: "0"           # no write calls at all
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
    networks:
      - socket_net


  app:
    image: traefik/whoami:v1.12.0
    container_name: app-lmax
    restart: unless-stopped
    labels:
      - "traefik.enable=true"

      # -- Middleware: real client IP --
      # The CDN is configured to add `X-From-Cdn: <secret>`; only requests that
      # carry it are trusted to say who the client is, so end users cannot spoof
      # Cf-Connecting-Ip. Any other request falls back to the TCP peer address.
      - "traefik.http.middlewares.real-ip.plugin.real-ip.Proxy[0].proxyHeadername=X-From-Cdn"
      - "traefik.http.middlewares.real-ip.plugin.real-ip.Proxy[0].proxyHeadervalue=lab-secret-rotate-me"
      - "traefik.http.middlewares.real-ip.plugin.real-ip.Proxy[0].realIP=Cf-Connecting-Ip"
      - "traefik.http.middlewares.real-ip.plugin.real-ip.Proxy[1].proxyHeadername=*"
      - "traefik.http.middlewares.real-ip.plugin.real-ip.Proxy[1].realIP=RemoteAddr"

      # -- Middleware: strip identity headers a client must never set --
      - "traefik.http.middlewares.strip-identity.plugin.htransformation.Rules[0].Name=drop-user-id"
      - "traefik.http.middlewares.strip-identity.plugin.htransformation.Rules[0].Header=X-User-ID"
      - "traefik.http.middlewares.strip-identity.plugin.htransformation.Rules[0].Type=Del"
      - "traefik.http.middlewares.strip-identity.plugin.htransformation.Rules[1].Name=mark-source"
      - "traefik.http.middlewares.strip-identity.plugin.htransformation.Rules[1].Header=X-Request-Source"
      - "traefik.http.middlewares.strip-identity.plugin.htransformation.Rules[1].Value=traefik-edge"
      - "traefik.http.middlewares.strip-identity.plugin.htransformation.Rules[1].Type=Set"

      # -- Middleware: security headers (built-in, no plugin needed) --
      - "traefik.http.middlewares.security-headers.headers.frameDeny=true"
      - "traefik.http.middlewares.security-headers.headers.contentTypeNosniff=true"
      - "traefik.http.middlewares.security-headers.headers.referrerPolicy=strict-origin-when-cross-origin"
      - "traefik.http.middlewares.security-headers.headers.stsSeconds=31536000"
      - "traefik.http.middlewares.security-headers.headers.stsIncludeSubdomains=true"
      - "traefik.http.middlewares.security-headers.headers.contentSecurityPolicy=default-src 'self'"
      - "traefik.http.middlewares.security-headers.headers.permissionsPolicy=camera=(), microphone=(), geolocation=()"

      # -- Router: chain them --
      - "traefik.http.routers.app.entrypoints=web"
      - "traefik.http.routers.app.rule=Host(`app.localhost`)"
      - "traefik.http.routers.app.middlewares=real-ip,strip-identity,security-headers"
      - "traefik.http.services.app.loadbalancer.server.port=80"
    networks:
      - traefik_net

networks:
  traefik_net:
    name: traefik_net
    driver: bridge
  socket_net:
    internal: true
