# Traefik L1 — Basic Reverse Proxy
# Demonstrates: EntryPoints, routers, services, Docker provider auto-discovery
# Usage: docker compose -f l1-basic-reverse-proxy-docker-compose-entrypoints-router-service.yml up -d

version: "3.9"

services:
  traefik:
    image: traefik:v3.0
    container_name: traefik
    restart: unless-stopped
    command:
      # --- Global ---
      - "--log.level=INFO"
      - "--accesslog=true"

      # --- API Dashboard (disable in prod or protect with auth) ---
      - "--api.dashboard=true"
      - "--api.insecure=true"          # dashboard on :8080, no TLS – dev only

      # --- EntryPoints ---
      - "--entrypoints.web.address=:80"

      # --- Providers ---
      - "--providers.docker=true"
      - "--providers.docker.exposedByDefault=false"   # opt-in per container
      - "--providers.docker.network=traefik_net"
    ports:
      - "80:80"
      - "8080:8080"     # dashboard
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
    networks:
      - traefik_net

  # Sample backend: whoami echoes request headers
  whoami:
    image: traefik/whoami
    container_name: whoami
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      # Router: match Host header
      - "traefik.http.routers.whoami.entrypoints=web"
      - "traefik.http.routers.whoami.rule=Host(`whoami.localhost`)"
      # Service: target container port
      - "traefik.http.services.whoami.loadbalancer.server.port=80"
    networks:
      - traefik_net

  # Second backend matched by Host + PathPrefix
  api-backend:
    image: traefik/whoami
    container_name: api-backend
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api.entrypoints=web"
      - "traefik.http.routers.api.rule=Host(`api.localhost`) && PathPrefix(`/v1`)"
      - "traefik.http.services.api.loadbalancer.server.port=80"
    networks:
      - traefik_net

networks:
  traefik_net:
    name: traefik_net
    driver: bridge
