# Dynamic configuration (file provider): a hardened TLS option set.
# Referenced from router labels as `hardened@file` (see l3).
tls:
  options:
    hardened:
      minVersion: VersionTLS12
      maxVersion: VersionTLS13
      cipherSuites:                     # applies to TLS 1.2; TLS 1.3 suites are fixed by Go
        - TLS_ECDHE_ECDSA_WITH_AES_256_GCM_SHA384
        - TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384
        - TLS_ECDHE_ECDSA_WITH_CHACHA20_POLY1305_SHA256
        - TLS_ECDHE_RSA_WITH_CHACHA20_POLY1305_SHA256
      curvePreferences:
        - CurveP521
        - CurveP384
      sniStrict: true                   # reject handshakes for hosts without a certificate
