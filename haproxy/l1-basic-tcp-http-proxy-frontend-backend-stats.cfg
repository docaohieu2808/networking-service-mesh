# HAProxy L1 - Basic TCP/HTTP proxy: frontend, backend, health checks, stats
# Targets HAProxy 3.4 (current LTS, fixes until Q2 2031).
# Demonstrates: global/defaults tuning, HTTP frontend, TCP frontend,
#               backend servers, active health checks, stats UI, Prometheus.
#
# Validate (CI runs the same thing): ./check.sh
#   ./check.sh builds a throw-away self-signed cert, mounts the config and the
#   etc/*.lst files and runs `haproxy -c` with the official haproxy:3.4-alpine.

#------------------------------------------------------------------------------
# GLOBAL - process-level settings
#------------------------------------------------------------------------------
global
    log         stdout format raw local0 info
    maxconn     50000               # max simultaneous connections across all frontends
    # No nbthread / cpu-map: since 2.5 HAProxy starts one thread per usable CPU
    # on its own. `nbthread` only takes an integer, "auto" is a parse error.

    # Security hardening (the official image ships the haproxy user and dir)
    chroot      /var/lib/haproxy
    user        haproxy
    group       haproxy

    # TLS defaults (Mozilla "intermediate" profile, applies to every bind/server)
    ssl-default-bind-ciphers      ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305
    ssl-default-bind-ciphersuites TLS_AES_128_GCM_SHA256:TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256
    ssl-default-bind-options      ssl-min-ver TLSv1.2 no-tls-tickets
    ssl-default-server-options    ssl-min-ver TLSv1.2 no-tls-tickets

#------------------------------------------------------------------------------
# DEFAULTS - inherited by all frontends and backends unless overridden
#------------------------------------------------------------------------------
defaults
    log     global
    mode    http                    # http | tcp
    option  httplog                 # structured HTTP access logging
    option  dontlognull             # skip logging empty connections (health probes)
    option  redispatch              # retry on a different server if the session fails
    # Keep-alive to clients and servers is the default in 3.x. The old
    # `option http-server-close` is only needed for odd legacy backends.

    timeout connect       5s        # TCP handshake to backend
    timeout client        30s       # max inactivity from client
    timeout server        30s       # max inactivity from backend
    timeout http-request  10s       # max time to receive the full request headers
    timeout http-keep-alive 5s      # keep-alive idle timeout
    timeout queue         10s       # max wait in server queue when all slots are full
    timeout tunnel        1h        # WebSocket / TCP tunnel mode

    retries 3
    default-server inter 10s downinter 5s rise 2 fall 3   # health check defaults

#------------------------------------------------------------------------------
# STATS - built-in stats UI, bound to loopback only
# The password comes from the environment: docker run -e STATS_PASSWORD=...
#------------------------------------------------------------------------------
frontend stats
    bind 127.0.0.1:8404
    mode http
    stats enable
    stats uri /stats
    stats realm HAProxy\ Statistics
    stats auth admin:"${STATS_PASSWORD}"
    stats refresh 10s
    stats show-legends
    stats show-node
    stats hide-version

#------------------------------------------------------------------------------
# PROMETHEUS - native exporter (built in since 2.4) on its own loopback port
#------------------------------------------------------------------------------
frontend prometheus
    bind 127.0.0.1:8405
    mode http
    http-request use-service prometheus-exporter if { path /metrics }

#------------------------------------------------------------------------------
# FRONTEND: HTTP (port 80) - redirect to HTTPS
#------------------------------------------------------------------------------
frontend http_in
    bind *:80
    mode http
    http-request redirect scheme https code 301 unless { ssl_fc }

#------------------------------------------------------------------------------
# FRONTEND: HTTPS (port 443) - TLS termination, route to backends
#------------------------------------------------------------------------------
frontend https_in
    bind *:443 ssl crt /etc/haproxy/certs/example.com.pem alpn h2,http/1.1
    mode http
    option forwardfor               # X-Forwarded-For only makes sense in http mode

    # Security headers on all responses.
    # HSTS without "preload": preloading is a one-way door, opt in on purpose.
    http-response set-header Strict-Transport-Security "max-age=63072000; includeSubDomains"
    http-response set-header X-Frame-Options DENY
    http-response set-header X-Content-Type-Options nosniff

    # Route by Host header
    use_backend be_api    if { hdr(host) -i api.example.com }
    use_backend be_static if { hdr(host) -i static.example.com }

    default_backend be_app

#------------------------------------------------------------------------------
# FRONTEND: TCP passthrough (port 9000) - raw TCP proxy (PostgreSQL)
#------------------------------------------------------------------------------
frontend tcp_postgres
    bind *:9000
    mode tcp
    option tcplog
    default_backend be_postgres

#------------------------------------------------------------------------------
# BACKEND: main web app - round-robin, HTTP health check
#------------------------------------------------------------------------------
backend be_app
    mode http
    balance roundrobin
    # `option httpchk` + `http-check send` replaces the old inline
    # "GET /health HTTP/1.1\r\nHost: ..." string, which 3.x rejects.
    option httpchk
    http-check send meth GET uri /health ver HTTP/1.1 hdr Host app.example.com
    http-check expect status 200

    server app1 10.0.1.10:3000 check weight 1 maxconn 200
    server app2 10.0.1.11:3000 check weight 1 maxconn 200
    server app3 10.0.1.12:3000 check weight 1 maxconn 200 backup   # used only if app1+app2 are down

#------------------------------------------------------------------------------
# BACKEND: API service - leastconn, cookie-based stickiness
#------------------------------------------------------------------------------
backend be_api
    mode http
    balance leastconn
    cookie SERVERID insert indirect nocache httponly secure

    option httpchk
    http-check send meth GET uri /api/health
    http-check expect status 200

    server api1 10.0.2.10:4000 check cookie api1 maxconn 500
    server api2 10.0.2.11:4000 check cookie api2 maxconn 500

#------------------------------------------------------------------------------
# BACKEND: static assets - `first` (fill server 1 up to maxconn, then server 2)
# `balance first` only makes sense when every server has a maxconn.
#------------------------------------------------------------------------------
backend be_static
    mode http
    balance first

    option httpchk
    http-check send meth HEAD uri /index.html
    http-check expect status 200

    server cdn1 10.0.3.10:80 check maxconn 100
    server cdn2 10.0.3.11:80 check maxconn 100

#------------------------------------------------------------------------------
# BACKEND: PostgreSQL - TCP mode, protocol-aware health check
# pgsql-check sends a real StartupMessage as <user> and expects an
# AuthenticationOk / auth request, not just an open port. The user does not
# need to exist for the server to answer with a well-formed reply.
#------------------------------------------------------------------------------
backend be_postgres
    mode tcp
    balance leastconn
    option pgsql-check user haproxy_check

    server pg1 10.0.4.10:5432 check inter 10s
    server pg2 10.0.4.11:5432 check inter 10s backup
