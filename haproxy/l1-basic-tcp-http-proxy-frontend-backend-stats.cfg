# HAProxy L1 — Basic TCP/HTTP Proxy: frontend, backend, stats page
# Demonstrates: global/defaults tuning, HTTP frontend, TCP frontend,
#               backend server definitions, health checks, stats UI
#
# Usage:
#   docker run --rm \
#     -v $(pwd)/l1-basic-tcp-http-proxy-frontend-backend-stats.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro \
#     -p 80:80 -p 443:443 -p 9000:9000 -p 8404:8404 \
#     haproxy:2.9-alpine haproxy -c -f /usr/local/etc/haproxy/haproxy.cfg

#──────────────────────────────────────────────────────────────────────────────
# GLOBAL — process-level settings
#──────────────────────────────────────────────────────────────────────────────
global
    log         stdout format raw local0 info
    maxconn     50000               # max simultaneous connections across all frontends
    nbthread    auto                # one thread per CPU core (HAProxy 1.8+)
    cpu-map     auto:1/1-4 0-3     # pin threads to CPUs 0-3 (adjust to your topology)
    ulimit-n    200000              # match maxconn * 4 (fd per connection)

    # Security hardening
    chroot      /var/lib/haproxy
    user        haproxy
    group       haproxy
    daemon

    # SSL/TLS defaults (applies to all bind/server lines)
    ssl-default-bind-ciphers    ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305
    ssl-default-bind-ciphersuites TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256
    ssl-default-bind-options    ssl-min-ver TLSv1.2 no-tls-tickets
    ssl-default-server-ciphers  ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384
    ssl-default-server-options  ssl-min-ver TLSv1.2 no-tls-tickets

#──────────────────────────────────────────────────────────────────────────────
# DEFAULTS — inherited by all frontends and backends unless overridden
#──────────────────────────────────────────────────────────────────────────────
defaults
    log     global
    mode    http                    # http | tcp | health
    option  httplog                 # structured HTTP access logging
    option  dontlognull             # skip logging empty connections (health probes)
    option  forwardfor              # inject X-Forwarded-For header
    option  http-server-close       # close backend conn after each request (saves FDs)
    option  redispatch              # retry on a different server if session fails

    timeout connect  5s             # TCP handshake to backend
    timeout client   30s            # max inactivity from client
    timeout server   30s            # max inactivity from backend
    timeout http-request 10s        # max time to receive full HTTP request headers
    timeout http-keep-alive 5s      # keep-alive idle timeout
    timeout queue    10s            # max wait in server queue when all slots full
    timeout tunnel   1h             # for WebSocket / TCP tunnel mode

    retries 3                       # retry failed connections before giving up
    default-server inter 10s downinter 5s rise 2 fall 3  # health check defaults

#──────────────────────────────────────────────────────────────────────────────
# STATS — built-in HAProxy stats UI
#──────────────────────────────────────────────────────────────────────────────
frontend stats
    bind *:8404
    mode http
    stats enable
    stats uri /stats
    stats realm HAProxy\ Statistics
    stats auth admin:changeme          # protect with basic auth (change password!)
    stats refresh 10s
    stats show-legends
    stats show-node
    stats hide-version                 # don't expose HAProxy version to attackers
    # Prometheus exporter (HAProxy 2.0+):
    http-request use-service prometheus-exporter if { path /metrics }

#──────────────────────────────────────────────────────────────────────────────
# FRONTEND: HTTP (port 80) — redirect to HTTPS
#──────────────────────────────────────────────────────────────────────────────
frontend http_in
    bind *:80
    mode http
    option httplog

    # Redirect all HTTP traffic to HTTPS
    http-request redirect scheme https code 301 unless { ssl_fc }

#──────────────────────────────────────────────────────────────────────────────
# FRONTEND: HTTPS (port 443) — TLS termination, route to backends
#──────────────────────────────────────────────────────────────────────────────
frontend https_in
    bind *:443 ssl crt /etc/haproxy/certs/example.com.pem alpn h2,http/1.1
    mode http
    option httplog

    # Add security headers on all responses
    http-response set-header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload"
    http-response set-header X-Frame-Options DENY
    http-response set-header X-Content-Type-Options nosniff

    # Route by Host header
    use_backend be_api    if { hdr(host) -i api.example.com }
    use_backend be_static if { hdr(host) -i static.example.com }

    default_backend be_app

#──────────────────────────────────────────────────────────────────────────────
# FRONTEND: TCP passthrough (port 9000) — raw TCP proxy (e.g. PostgreSQL)
#──────────────────────────────────────────────────────────────────────────────
frontend tcp_postgres
    bind *:9000
    mode tcp
    option tcplog
    default_backend be_postgres

#──────────────────────────────────────────────────────────────────────────────
# BACKEND: Main web app — round-robin, HTTP health check
#──────────────────────────────────────────────────────────────────────────────
backend be_app
    mode http
    balance roundrobin
    option httpchk GET /health HTTP/1.1\r\nHost:\ app.example.com
    http-check expect status 200

    server app1 10.0.1.10:3000 check weight 1 maxconn 200
    server app2 10.0.1.11:3000 check weight 1 maxconn 200
    server app3 10.0.1.12:3000 check weight 1 maxconn 200 backup  # backup only

#──────────────────────────────────────────────────────────────────────────────
# BACKEND: API service — leastconn, cookie-based stickiness
#──────────────────────────────────────────────────────────────────────────────
backend be_api
    mode http
    balance leastconn
    cookie SERVERID insert indirect nocache httponly secure

    option httpchk GET /api/health
    http-check expect status 200

    server api1 10.0.2.10:4000 check cookie api1 maxconn 500
    server api2 10.0.2.11:4000 check cookie api2 maxconn 500

#──────────────────────────────────────────────────────────────────────────────
# BACKEND: Static assets — first (pick first available, good for cache hits)
#──────────────────────────────────────────────────────────────────────────────
backend be_static
    mode http
    balance first
    option httpchk HEAD /index.html
    http-check expect status 200

    server cdn1 10.0.3.10:80 check
    server cdn2 10.0.3.11:80 check

#──────────────────────────────────────────────────────────────────────────────
# BACKEND: PostgreSQL — TCP mode, binary health check (send/expect)
#──────────────────────────────────────────────────────────────────────────────
backend be_postgres
    mode tcp
    balance leastconn
    option tcp-check

    # PostgreSQL startup message check (crude but effective for TCP-level health)
    tcp-check connect
    tcp-check send-binary 00000008 04d2162f   # cancel request — triggers error response
    # A real pg_isready check requires a proper startup packet; use external script instead.

    server pg1 10.0.4.10:5432 check inter 10s
    server pg2 10.0.4.11:5432 check inter 10s backup
