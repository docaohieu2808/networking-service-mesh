# Istio L4 — AuthorizationPolicy, PeerAuthentication (mTLS), RBAC
# Demonstrates: namespace-wide mTLS enforcement, service-level RBAC,
#               JWT end-user authentication, deny-by-default, allow-listing
#
# API: security.istio.io/v1 (GA since Istio 1.22).
# Apply: kubectl apply -f l4-authorization-policy-mtls-peer-authentication-rbac.yaml
# Prereq: the ingress gateway from l1c (ServiceAccount istio-ingressgateway).
# Sidecar mode: these policies are enforced by each pod's proxy.
# Ambient mode: L4 rules (principals, namespaces, ports) are enforced by ztunnel;
# rules on methods/paths/JWT claims need a waypoint (see l3b).

---
# ── PeerAuthentication: enforce strict mTLS namespace-wide ───────────────────
# All pods in 'production' namespace must use mTLS for inbound traffic.
# Sidecars that haven't migrated yet: set mode: PERMISSIVE on their own PA.
apiVersion: security.istio.io/v1
kind: PeerAuthentication
metadata:
  name: production-strict-mtls
  namespace: production
spec:
  mtls:
    mode: STRICT    # STRICT | PERMISSIVE | DISABLE

---
# ── PeerAuthentication: per-workload override (legacy service still migrating) ─
apiVersion: security.istio.io/v1
kind: PeerAuthentication
metadata:
  name: legacy-service-permissive-mtls
  namespace: production
spec:
  selector:
    matchLabels:
      app: legacy-service    # only this workload
  mtls:
    mode: PERMISSIVE         # allow both plain and mTLS until migration complete
  # Per-port overrides (e.g., metrics port doesn't need mTLS)
  portLevelMtls:
    9090:
      mode: DISABLE          # Prometheus scrapes metrics without mTLS

---
# ── AuthorizationPolicy: deny all by default (zero-trust baseline) ────────────
# With NO AuthorizationPolicy at all, everything is allowed. As soon as one ALLOW
# policy selects a workload, only what some ALLOW policy matches is let through.
# An ALLOW policy with an empty spec has no rule that can match, so it allows
# nothing: that is the namespace-wide deny-all baseline. Explicit ALLOW policies
# below then open the paths you want.
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: deny-all-default
  namespace: production
spec:
  {}   # no selector, no rules: nothing is allowed to any workload in this namespace

---
# ── AuthorizationPolicy: allow ingress gateway to reach app-service ───────────
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: allow-ingress-to-app
  namespace: production
spec:
  selector:
    matchLabels:
      app: app-service
  action: ALLOW
  rules:
    - from:
        # Only the ingress gateway's service account may call this service
        - source:
            principals:
              - "cluster.local/ns/istio-system/sa/istio-ingressgateway"      # SA created by the gateway chart (l1c)
      to:
        - operation:
            methods: ["GET", "POST"]
            ports: ["3000"]

---
# ── AuthorizationPolicy: service-to-service RBAC ─────────────────────────────
# api-service may call reviews-service; nothing else can
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: reviews-allow-api-service
  namespace: production
spec:
  selector:
    matchLabels:
      app: reviews
  action: ALLOW
  rules:
    - from:
        - source:
            # Match by SPIFFE identity (mTLS peer cert)
            principals:
              - "cluster.local/ns/production/sa/api-service"
        - source:
            # Also allow from staging namespace for integration tests
            namespaces: ["staging"]
      to:
        - operation:
            methods: ["GET"]
            paths: ["/api/reviews*"]
            ports: ["8080"]

---
# ── AuthorizationPolicy: JWT end-user authentication ─────────────────────────
# Validates JWT from Authorization: Bearer <token> header
# Requires RequestAuthentication to be defined first (see below)
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: require-jwt-for-api
  namespace: production
spec:
  selector:
    matchLabels:
      app: api-service
  action: ALLOW
  rules:
    - from:
        - source:
            # requestPrincipals: extracted from validated JWT sub claim
            requestPrincipals: ["*"]   # any valid JWT principal
      to:
        - operation:
            methods: ["GET", "POST", "PUT", "DELETE"]
      when:
        # Require specific JWT claim (role = admin for write operations)
        - key: request.auth.claims[role]
          values: ["admin", "editor", "viewer"]

---
# ── RequestAuthentication: define valid JWT issuers ──────────────────────────
# Must be defined alongside AuthorizationPolicy that checks requestPrincipals
apiVersion: security.istio.io/v1
kind: RequestAuthentication
metadata:
  name: api-jwt-auth
  namespace: production
spec:
  selector:
    matchLabels:
      app: api-service
  jwtRules:
    # Primary issuer: internal Auth service
    - issuer: "https://auth.example.com"
      jwksUri: "https://auth.example.com/.well-known/jwks.json"
      audiences:
        - "api.example.com"
      # JWKS cache refresh is NOT a field here: it is set on istiod with the
      # PILOT_JWT_PUB_KEY_REFRESH_INTERVAL environment variable.
      # Forward the validated JWT to the backend (for logging/audit)
      forwardOriginalToken: true
      # Copy claims into request headers for the app (this does not create the
      # request principal: that is always <issuer>/<sub>)
      outputClaimToHeaders:
        - header: x-jwt-sub
          claim: sub
        - header: x-jwt-role
          claim: role

    # Secondary issuer: third-party OAuth provider
    - issuer: "https://accounts.google.com"
      jwksUri: "https://www.googleapis.com/oauth2/v3/certs"
      audiences:
        - "your-google-client-id.apps.googleusercontent.com"

---
# ── AuthorizationPolicy: admin namespace full access for ops team ─────────────
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: allow-ops-namespace-full-access
  namespace: production
spec:
  # No selector = applies to all workloads in namespace
  action: ALLOW
  rules:
    - from:
        # Fields inside ONE source are ANDed (a namespace AND a principal would
        # have to match together), so list the identities and let the list OR.
        - source:
            principals:
              - "cluster.local/ns/ops/sa/prometheus"
              - "cluster.local/ns/monitoring/sa/grafana"
      to:
        - operation:
            # Allow metrics scraping on any port
            paths: ["/metrics", "/stats/prometheus"]
