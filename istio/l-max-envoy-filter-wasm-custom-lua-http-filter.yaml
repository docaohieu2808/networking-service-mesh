# Istio L-MAX - Extensibility: WasmPlugin, EnvoyFilter (Lua), external authorization
# Demonstrates: the supported extension points in order of preference
#   1. AuthorizationPolicy action CUSTOM + meshConfig.extensionProviders  (external authz)
#   2. WasmPlugin                                                        (compiled filters; l-max-wasm-plugin-oci-module-placeholder.yaml)
#   3. EnvoyFilter                                                       (raw Envoy patches, last resort)
# EnvoyFilter has no compatibility guarantee: Envoy internals change between
# Istio releases, so keep every EnvoyFilter small and re-test it on each upgrade.
#
# Prereq: istiod installed with the Helm values in l1 (they declare the
#         `ext-authz-grpc` extension provider used below); namespace production
#         labeled istio-injection=enabled.
# Apply: kubectl apply -f l-max-envoy-filter-wasm-custom-lua-http-filter.yaml
# CI applies the Lua EnvoyFilter on a real sidecar and checks the response header.

---
# ── External authorization the supported way ─────────────────────────────────
# The provider (name, gRPC service, timeout, failOpen: false) is declared once in
# meshConfig.extensionProviders. This policy sends matching requests to it.
# The earlier version of this file hand-wrote an ext_authz EnvoyFilter plus a raw
# cluster; this replaces both.
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: ingress-ext-authz
  namespace: istio-system
spec:
  selector:
    matchLabels:
      istio: ingressgateway
  action: CUSTOM
  provider:
    name: ext-authz-grpc
  rules:
    - to:
        - operation:
            notPaths: ["/health", "/metrics"]     # no external call for probes and scrapes

---
# ── EnvoyFilter: inline Lua HTTP filter on the inbound listener ──────────────
# Runs a Lua script for every request that reaches api-service (port 8080).
# Use it for small header tweaks that no Istio API covers; reach for WasmPlugin
# when the logic grows.
apiVersion: networking.istio.io/v1alpha3
kind: EnvoyFilter
metadata:
  name: lua-request-id-injector
  namespace: production
spec:
  workloadSelector:
    labels:
      app: api-service
  configPatches:
    - applyTo: HTTP_FILTER
      match:
        context: SIDECAR_INBOUND          # SIDECAR_INBOUND | SIDECAR_OUTBOUND | GATEWAY
        listener:
          portNumber: 8080
          filterChain:
            filter:
              name: envoy.filters.network.http_connection_manager
              subFilter:
                name: envoy.filters.http.router
      patch:
        operation: INSERT_BEFORE          # run before the router filter
        value:
          # One filter, one typed_config. (Listing `name` and `typed_config` twice,
          # as an earlier version did, is a duplicate YAML key and is rejected.)
          name: envoy.filters.http.lua
          typed_config:
            "@type": type.googleapis.com/envoy.extensions.filters.http.lua.v3.Lua
            inline_code: |
              function envoy_on_request(request_handle)
                -- Make sure every request carries an id (Envoy normally sets x-request-id itself)
                local req_id = request_handle:headers():get("x-request-id")
                if not req_id or req_id == "" then
                  request_handle:headers():replace("x-request-id", "lua-" .. tostring(os.time()))
                end

                -- Strip headers that must never come from a client
                request_handle:headers():remove("x-internal-debug")
                request_handle:headers():remove("x-admin-bypass")

                request_handle:logInfo(string.format(
                  "LUA: method=%s path=%s id=%s",
                  request_handle:headers():get(":method"),
                  request_handle:headers():get(":path"),
                  request_handle:headers():get("x-request-id")
                ))
              end

              function envoy_on_response(response_handle)
                response_handle:headers():replace("x-served-by", "envoy-lua")
                response_handle:headers():remove("server")
                response_handle:headers():remove("x-powered-by")
              end

---
# ── EnvoyFilter: HTTP connection manager tuning ──────────────────────────────
# Istio already enables normalize_path and merge_slashes by default, so only
# settings Istio does not expose are patched here.
apiVersion: networking.istio.io/v1alpha3
kind: EnvoyFilter
metadata:
  name: hcm-tuning
  namespace: production
spec:
  workloadSelector:
    labels:
      app: api-service
  configPatches:
    - applyTo: NETWORK_FILTER
      match:
        context: SIDECAR_INBOUND
        listener:
          portNumber: 8080
          filterChain:
            filter:
              name: envoy.filters.network.http_connection_manager
      patch:
        operation: MERGE
        value:
          typed_config:
            "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
            max_request_headers_kb: 96        # default 60
