# Istio L-MAX — EnvoyFilter: WASM extension + Lua HTTP filter + custom cluster
# Demonstrates: EnvoyFilter patching at LISTENER/HTTP_FILTER/CLUSTER level,
#               inline Lua filter, WASM plugin via WasmPlugin CR (Istio 1.12+),
#               custom Envoy cluster for external auth, header manipulation
#
# Apply: kubectl apply -f l-max-envoy-filter-wasm-custom-lua-http-filter.yaml
# Prereq: Istio >= 1.12 for WasmPlugin CR; EnvoyFilter works on any version.

---
# ── WasmPlugin CR (preferred over EnvoyFilter for WASM in Istio 1.12+) ───────
# Loads a WASM module from OCI registry into all matched sidecars.
# Build your own: https://github.com/proxy-wasm/proxy-wasm-go-sdk
apiVersion: extensions.istio.io/v1alpha1
kind: WasmPlugin
metadata:
  name: custom-auth-wasm-plugin
  namespace: production
spec:
  selector:
    matchLabels:
      app: api-service
  url: oci://ghcr.io/example/custom-auth-filter:v1.2.0
  # sha256: abc123...  # pin digest for production
  phase: AUTHN          # UNSPECIFIED_PHASE | AUTHN | AUTHZ | STATS
  priority: 10          # lower = runs earlier within same phase
  pluginConfig:
    # Arbitrary config passed to the WASM module via OnConfigure()
    auth_service_url: "http://auth-service.production.svc.cluster.local:8080"
    cache_ttl_seconds: 300
    bypass_paths:
      - "/health"
      - "/metrics"
  imagePullPolicy: IfNotPresent
  # imagePullSecret: wasm-registry-secret  # for private OCI registries

---
# ── EnvoyFilter: inject inline Lua HTTP filter into inbound listener ──────────
# Runs Lua script in every request through the api-service sidecar proxy.
# Use for: header manipulation, logging, simple auth checks without WASM overhead.
apiVersion: networking.istio.io/v1alpha3
kind: EnvoyFilter
metadata:
  name: lua-request-id-injector
  namespace: production
spec:
  workloadSelector:
    labels:
      app: api-service
  configPatches:
    # Patch the HTTP connection manager on inbound (virtual inbound) listener
    - applyTo: HTTP_FILTER
      match:
        context: SIDECAR_INBOUND          # SIDECAR_INBOUND | SIDECAR_OUTBOUND | GATEWAY
        listener:
          portNumber: 8080
          filterChain:
            filter:
              name: envoy.filters.network.http_connection_manager
              subFilter:
                name: envoy.filters.http.router
      patch:
        operation: INSERT_BEFORE          # insert before the router filter
        value:
          name: envoy.filters.http.lua
          typed_config:
            "@type": type.googleapis.com/envoy.extensions.filters.http.lua.v3.LuaPerRoute
          # Inline Lua script executed per request
          # Note: for INSERT_BEFORE on HTTP_FILTER, use LuaPerRoute or envoy_lua
          name: envoy.lua
          typed_config:
            "@type": type.googleapis.com/envoy.extensions.filters.http.lua.v3.Lua
            inline_code: |
              function envoy_on_request(request_handle)
                -- Generate or propagate request ID
                local req_id = request_handle:headers():get("x-request-id")
                if not req_id or req_id == "" then
                  -- Simple pseudo-random ID (use WASM for crypto-quality UUID)
                  local ts = tostring(os.time())
                  request_handle:headers():replace("x-request-id", "lua-" .. ts)
                end

                -- Remove sensitive headers before forwarding to app
                request_handle:headers():remove("x-internal-debug")
                request_handle:headers():remove("x-admin-bypass")

                -- Log request metadata
                request_handle:logInfo(string.format(
                  "LUA: method=%s path=%s id=%s",
                  request_handle:headers():get(":method"),
                  request_handle:headers():get(":path"),
                  request_handle:headers():get("x-request-id")
                ))
              end

              function envoy_on_response(response_handle)
                -- Inject server-timing header for observability
                local status = response_handle:headers():get(":status")
                response_handle:headers():replace("x-served-by", "envoy-lua")
                -- Remove upstream server identity
                response_handle:headers():remove("server")
                response_handle:headers():remove("x-powered-by")
              end

---
# ── EnvoyFilter: add custom external authorization cluster ────────────────────
# Adds a raw Envoy cluster config that Istio doesn't expose natively.
# Used to point ext_authz filter at an out-of-mesh gRPC auth service.
apiVersion: networking.istio.io/v1alpha3
kind: EnvoyFilter
metadata:
  name: ext-authz-cluster
  namespace: istio-system    # cluster-scoped when in istio-system
spec:
  configPatches:
    - applyTo: CLUSTER
      match:
        context: ANY
      patch:
        operation: ADD
        value:
          name: ext_authz_cluster
          type: STRICT_DNS
          connect_timeout: 2s
          http2_protocol_options: {}     # force HTTP/2 for gRPC
          load_assignment:
            cluster_name: ext_authz_cluster
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        socket_address:
                          address: auth-grpc.production.svc.cluster.local
                          port_value: 9001

---
# ── EnvoyFilter: enable ext_authz HTTP filter on gateway ─────────────────────
apiVersion: networking.istio.io/v1alpha3
kind: EnvoyFilter
metadata:
  name: gateway-ext-authz-filter
  namespace: istio-system
spec:
  workloadSelector:
    labels:
      istio: ingressgateway
  configPatches:
    - applyTo: HTTP_FILTER
      match:
        context: GATEWAY
        listener:
          filterChain:
            filter:
              name: envoy.filters.network.http_connection_manager
              subFilter:
                name: envoy.filters.http.router
      patch:
        operation: INSERT_BEFORE
        value:
          name: envoy.filters.http.ext_authz
          typed_config:
            "@type": type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthz
            grpc_service:
              envoy_grpc:
                cluster_name: ext_authz_cluster
              timeout: 2s
            failure_mode_allow: false    # deny on auth service failure (fail-closed)
            with_request_body:
              max_request_bytes: 8192
              allow_partial_message: true
            # Headers from auth service response to forward to upstream
            allowed_headers:
              patterns:
                - exact: x-user-id
                - exact: x-user-role
                - prefix: x-auth-

---
# ── EnvoyFilter: HTTP connection manager tuning ───────────────────────────────
apiVersion: networking.istio.io/v1alpha3
kind: EnvoyFilter
metadata:
  name: hcm-tuning
  namespace: production
spec:
  workloadSelector:
    labels:
      app: api-service
  configPatches:
    - applyTo: NETWORK_FILTER
      match:
        context: SIDECAR_INBOUND
        listener:
          portNumber: 8080
          filterChain:
            filter:
              name: envoy.filters.network.http_connection_manager
      patch:
        operation: MERGE
        value:
          typed_config:
            "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
            # Increase max request headers size (default 60KB)
            max_request_headers_kb: 96
            # Enable HTTP/2 server-side
            http2_protocol_options:
              max_concurrent_streams: 100
              initial_stream_window_size: 65536
            # Normalize paths (decode %2F etc.) before routing
            normalize_path: true
            # Merge slashes in path
            merge_slashes: true
            # Request ID generation
            request_id_extension:
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.request_id.uuid.v3.UuidRequestIdConfig
                use_request_id_for_trace_sampling: true
