# Services the manifests in l2/l3/l-max route to or reference by name.
# They have no pods behind them: they exist so `istioctl analyze` can resolve
# every host (a VirtualService to a missing Service is IST0101, an error).
# In a real cluster these are your own services.
---
apiVersion: v1
kind: Service
metadata:
  name: app-service
  namespace: production
spec:
  selector:
    app: app-service
  ports:
    - name: http
      port: 3000
      targetPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: api-v1-service
  namespace: production
spec:
  selector:
    app: api-v1-service
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: api-v2-service
  namespace: production
spec:
  selector:
    app: api-v2-service
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: production
spec:
  selector:
    app: postgres
  ports:
    - name: tcp
      port: 5432
      targetPort: 5432
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: production
spec:
  selector:
    app: auth-service
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: auth-grpc
  namespace: production
spec:
  selector:
    app: auth-grpc
  ports:
    - name: grpc
      port: 9001
      targetPort: 9001
