# Istio L3b - Kubernetes Gateway API: ingress Gateway + HTTPRoute, ambient waypoint
# Istio's long-term direction is the Gateway API (gateway.networking.k8s.io/v1)
# over its own Gateway/VirtualService. The two can run side by side.
#
# Prereq: Gateway API CRDs (Istio does not install them):
#   kubectl apply -f https://github.com/kubernetes-sigs/gateway-api/releases/download/v1.6.3/standard-install.yaml
# Istio then creates a Deployment + Service for each Gateway below by itself.
#
# Apply: kubectl apply -f l3b-gateway-api-httproute-waypoint.yaml
---
apiVersion: v1
kind: Namespace
metadata:
  name: gateway-api-demo
  labels:
    istio.io/dataplane-mode: ambient     # this namespace runs on ztunnel, no sidecars
---
# Ingress: Istio provisions the proxy for this Gateway (gatewayClassName: istio)
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: web
  namespace: gateway-api-demo
spec:
  gatewayClassName: istio
  listeners:
    - name: http
      port: 80
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: Same
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: echo
  namespace: gateway-api-demo
spec:
  parentRefs:
    - name: web
  hostnames:
    - echo.example.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: echo
          port: 80
---
# Waypoint: the optional L7 proxy of ambient mode, one per namespace or service.
# Without a waypoint ambient gives mTLS + L4 authorization only (ztunnel);
# retries, header routing and L7 AuthorizationPolicy need this.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: waypoint
  namespace: gateway-api-demo
  labels:
    istio.io/waypoint-for: service      # service | workload | all | none
spec:
  gatewayClassName: istio-waypoint
  listeners:
    - name: mesh
      port: 15008
      protocol: HBONE
---
# Sample backend so the routes above point at something real
apiVersion: v1
kind: Service
metadata:
  name: echo
  namespace: gateway-api-demo
spec:
  selector:
    app: echo
  ports:
    - port: 80
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: echo
  namespace: gateway-api-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: echo
  template:
    metadata:
      labels:
        app: echo
    spec:
      containers:
        - name: echo
          image: traefik/whoami:v1.12.0
          args: ["--port", "8080"]
          ports:
            - containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 10001
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
