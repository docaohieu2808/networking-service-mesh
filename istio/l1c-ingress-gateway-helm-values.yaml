# Istio L1c - Values for the standalone ingress gateway (Helm chart `istio/gateway`)
# Gateways are installed apart from the control plane, in their own namespace
# when you can, so they upgrade on their own schedule.
#   helm install istio-ingressgateway istio/gateway -n istio-system --version 1.30.7 \
#     -f l1c-ingress-gateway-helm-values.yaml
# The label `istio: ingressgateway` is what the `selector` of the Gateway
# resources in l3 matches. The pod's ServiceAccount is `istio-ingressgateway`
# (referenced by the AuthorizationPolicy in l4).
name: istio-ingressgateway
labels:
  istio: ingressgateway

service:
  type: LoadBalancer          # use NodePort on kind / bare metal without a load balancer
  ports:
    - name: status-port
      port: 15021
      targetPort: 15021
    - name: http2
      port: 80
      targetPort: 80
    - name: https
      port: 443
      targetPort: 443

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    memory: 1Gi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
