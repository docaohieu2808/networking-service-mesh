# Istio L1 - Install with Helm: values for the `istiod` chart (ambient profile)
# Demonstrates: Helm values (NOT an IstioOperator CR: Helm silently ignores
#               apiVersion/kind/spec, so an operator file passed to `helm -f`
#               installs plain defaults), mesh-wide config, extension
#               providers, resource tuning, ambient mode.
#
# Versions: Istio 1.30.7. The Istio Helm repo has no stable 1.31.x chart yet
# (checked 2026-10-26); 1.30 and 1.31 are both supported releases.
#
# Install (ambient data plane = ztunnel + istio-cni, no sidecars needed):
#   helm repo add istio https://istio-release.storage.googleapis.com/charts && helm repo update
#   helm install istio-base istio/base -n istio-system --create-namespace --version 1.30.7
#   helm install istiod istio/istiod -n istio-system --version 1.30.7 -f l1-install-profile-minimal-demo-ambient-helm-values.yaml --wait
#   helm install istio-cni istio/cni -n istio-system --version 1.30.7 --set profile=ambient --wait
#   helm install ztunnel istio/ztunnel -n istio-system --version 1.30.7 --wait
# Then opt a namespace in:        kubectl label ns demo istio.io/dataplane-mode=ambient
# L7 features need a waypoint:    istioctl waypoint apply -n demo --enroll-namespace
# Sidecars still work side by side: kubectl label ns demo istio-injection=enabled
#
# Other install routes in this directory:
#   l1b-... : IstioOperator for `istioctl install -f` (classic sidecar install)
#   l1c-... : values for the standalone ingress `gateway` chart
# Small cluster (kind): add --set autoscaleMin=1 --set resources.requests.memory=256Mi

profile: ambient

# istiod settings sit at the ROOT of the istiod chart's values (in older charts they
# lived under `pilot:`; keys under `pilot:` are now silently ignored).
autoscaleEnabled: true
autoscaleMin: 2            # HA: two replicas in a real cluster
autoscaleMax: 5
resources:
  requests:
    cpu: 100m
    memory: 512Mi
  limits:
    memory: 1Gi
traceSampling: 1.0         # percent; a Telemetry resource (l1-telemetry-...) overrides per workload

# Mesh-wide configuration (rendered into the `istio` ConfigMap in istio-system)
meshConfig:
  accessLogFile: /dev/stdout
  accessLogEncoding: JSON  # required for accessLogFormat to be read as JSON
  accessLogFormat: |
    {
      "start_time": "%START_TIME%",
      "method": "%REQ(:METHOD)%",
      "path": "%REQ(X-ENVOY-ORIGINAL-PATH?:PATH)%",
      "protocol": "%PROTOCOL%",
      "response_code": "%RESPONSE_CODE%",
      "duration": "%DURATION%",
      "upstream_host": "%UPSTREAM_HOST%",
      "x_forwarded_for": "%REQ(X-FORWARDED-FOR)%",
      "trace_id": "%REQ(X-B3-TRACEID)%"
    }
  enablePrometheusMerge: true

  # One defaultConfig block only: a duplicate YAML key silently drops the first.
  defaultConfig:
    holdApplicationUntilProxyStarts: true   # app container waits for the sidecar

  # REGISTRY_ONLY blocks traffic to hosts without a ServiceEntry. Switch to
  # ALLOW_ANY while onboarding services that call external APIs.
  outboundTrafficPolicy:
    mode: REGISTRY_ONLY

  # Providers that Telemetry / AuthorizationPolicy resources refer to by name.
  # Tracing is configured with the Telemetry API (l1-telemetry-...), not with the
  # old enableTracing / defaultConfig.tracing fields.
  extensionProviders:
    - name: otel-tracing
      opentelemetry:
        service: otel-collector.observability.svc.cluster.local
        port: 4317
    # External authorization (used by AuthorizationPolicy action CUSTOM in l-max)
    - name: ext-authz-grpc
      envoyExtAuthzGrpc:
        service: auth-grpc.production.svc.cluster.local
        port: 9001
        timeout: 2s
        failOpen: false      # deny when the auth service is down

# Sidecar proxy defaults (only used by pods that run a sidecar)
global:
  proxy:
    resources:
      requests:
        cpu: 10m
        memory: 40Mi
      limits:
        cpu: 200m
        memory: 256Mi
    logLevel: warning                  # trace|debug|info|warning|error|critical|off
    componentLogLevel: "misc:error"
sidecarInjectorWebhook:
  enableNamespacesByDefault: false     # opt in with label istio-injection=enabled
  rewriteAppHTTPProbe: true            # probes keep working when mTLS is STRICT
